# IEC 60870-5-104 relay: the protocol that operates the electricity grid,
# put behind something that can refuse a breaker trip.
#
# The problem this configuration solves is not subtle. A control centre and
# a substation gateway exchange ASDUs over plain TCP on port 2404, with no
# authentication and no integrity anywhere in the standard. Anyone who can
# reach the gateway can open a breaker on it. The gateways cannot be fixed:
# they are substation equipment with twenty-year service lives, and the
# process they run does not stop for an upgrade.
#
# What the protocol does have is structure, and this relay enforces it:
#   - which stations may be addressed at all (common_addresses)
#   - which commands may be sent, by whom, to which points (rules)
#   - that a dangerous command is selected before it is executed
#     (require_select) — which the standard describes and the equipment
#     mostly does not enforce
#   - that a station cannot command its own control centre
#   - that the sequence numbering adds up, in both directions
#
# Validate with: xproxyctl -config examples/ot/iec104.yaml validate
version: 1

logging:
  directory: /var/log/xproxy
  access: {file: access.log}
  security: {file: security.log}
  audit: {file: audit.log}

management:
  socket: /run/xproxy/mgmt.sock
  socket_mode: "0660"

server:
  listeners:
    # ---------------------------------------------------------------
    # The operational link: the control centre connects here, the relay
    # dials the substation gateway.
    #
    # There is no per-address routing on this kind, and the reason is the
    # protocol's own shape: the first frame a control centre sends is
    # STARTDT_act, a U-format frame with no common address in it, so a
    # relay could not choose a pool from the address until the first I
    # frame — by which time the association is already up. One listener
    # per association is the honest shape.
    # ---------------------------------------------------------------
    - name: substation-a
      address: "10.40.0.10:2404"
      kind: iec104
      iec104:
        upstream: rtu-a

        # Only the control centre, and only the station it is for.
        allow_clients: ["10.40.1.0/24"]
        common_addresses: ["1"]

        # The two-step form, made mandatory. This is the single most
        # valuable line in the file: it turns one injected command frame
        # from a breaker operation into a refusal.
        require_select: true
        select_timeout: 30s

        # The control centre reaches this substation over two paths, and
        # edition 2 calls that a redundancy group. Declaring it does two
        # things.
        #
        # It stops the second path carrying anything while the first has
        # data transfer, so a command injected on a fresh connection from
        # inside the control centre's network is refused before it reaches
        # the RTU — and a takeover is a logged failover rather than a
        # quiet change of path.
        #
        # And it is what makes require_select above survivable. A
        # selection belongs to the connection that made it, so without
        # the group a failover between the select and the execute refuses
        # a legitimate two-step command — which is how require_select
        # gets turned off after one bad night. carry_selects keeps it
        # across the group's paths; the bound on that is the two-address
        # client list here plus the rule that only the path holding data
        # transfer may execute anything.
        redundancy:
          groups:
            - name: control-centre
              clients: ["10.40.1.11/32", "10.40.1.12/32"]
              max_connections: 2

        # STOPDT_act is not in the list. It stops data transfer, so a
        # client that may send it blinds the control room without
        # refusing a single command — and naming STARTDT_act names its
        # confirmation, so the station's reply is not refused.
        allow_controls: [STARTDT_act, TESTFR_act]

        # A control centre that sends a thousand breaker commands a
        # second is not a busy control centre. The frame limit is loose
        # because telemetry is most of the traffic; the command limit is
        # what actually bounds the damage.
        rate_limit: 500
        rate_burst: 1000
        command_rate_limit: 5
        command_rate_burst: 10

        # How the rules below were arrived at, and how to arrive at them
        # for the next substation. Nobody knows what a substation's
        # traffic actually is: the drawings say which points exist and
        # which of them the control centre is supposed to command, and the
        # traffic says what the integrator left behind. A policy written
        # from the drawings refuses half of it on the first shift, which
        # is how a security control gets turned off and stays off.
        #
        # So for the first week the listener records instead of deciding,
        # and the report is what the rules get written from. Take this out
        # once they are written -- validation warns about a learning
        # section with no enforce, because one left on by accident is a
        # relay that decides nothing.
        #
        # learn:
        #   enabled: true
        #   file: /var/lib/xproxy/iec104-substation-a.yaml
        #   interval: 15m
        #   # enforce: true would keep the rules below in force while
        #   # recording, which is the second phase: the report then says
        #   # which rules the traffic disagrees with, per subject, in
        #   # denied_by_policy.

        default_action: deny
        deny_response: negative
        rules:
          # Telemetry travelling up, always. Refusing telemetry blinds
          # the control room, which is its own kind of incident.
          - name: telemetry
            action: allow
            class: [monitoring]

          # The interrogations a control centre sends after a restart to
          # rebuild its picture. They ask the station to do something, so
          # they are commands by cause; they operate nothing.
          - name: interrogation
            action: allow
            types: [C_IC_NA_1, C_CI_NA_1, C_RD_NA_1]
            causes: [act, deact]

          # The IEC 60870-5-7 authentication exchange. Its own rule and its
          # own class: a rule that allowed it as a "system" command would
          # also allow a station reset. Without this the listener refuses
          # the authentication as an unknown type, which makes the
          # standard's own security unusable through the relay.
          - name: authentication
            action: allow
            class: [security]

          # The keepalive's own test command.
          - name: test
            action: allow
            types: [C_TS_NA_1, C_TS_TA_1]

          # Breakers and switches, by point, during the day shift only.
          # The points are the substation's own numbering: this is the
          # line an engineer confirms against the point list.
          - name: switching
            action: allow
            types: [C_SC_NA_1, C_DC_NA_1, C_SC_TA_1, C_DC_TA_1]
            addresses: ["4000-4099"]
            causes: [act, deact]
            schedule: {days: [mon, tue, wed, thu, fri], from: "07:00", to: "19:00"}

          # Tap changers: a regulating step command, narrower still.
          - name: tap-changer
            action: allow
            types: [C_RC_NA_1, C_RC_TA_1]
            addresses: ["4200-4209"]
            causes: [act, deact]

          # Setpoints from the one engineering workstation that has any
          # business writing them.
          - name: setpoints
            action: allow
            clients: ["10.40.1.20/32"]
            types: [C_SE_NA_1, C_SE_NB_1, C_SE_NC_1]
            addresses: ["5000-5099"]
            causes: [act, deact]

          # Named refusals, so that the security log says which one it
          # was rather than "default deny". C_RP_NA_1 reboots a station
          # and C_CS_NA_1 moves its clock — which changes the meaning of
          # every timestamp in the historian and of every protection
          # function keyed to one.
          - name: no-reset
            action: deny
            types: [C_RP_NA_1]
          - name: no-clock
            action: deny
            types: [C_CS_NA_1]
          - name: no-parameters
            action: deny
            class: [parameter]
          - name: no-files
            action: deny
            class: [file]

        # IEC 62351-5, as far as a relay in the middle can honestly go.
        # IEC 60870-5-7 adds the authentication this protocol has none of:
        # the station challenges a critical command and the control centre
        # answers with an HMAC over it. This relay recognises the exchange
        # and carries it -- the `auth` rule below is what makes that
        # possible, and without a rule for the security class the listener
        # would refuse the authentication and make it unusable -- and it
        # does NOT verify it. Verifying means holding the update keys, and
        # a relay holding them would be a second place to take them from.
        #
        # So leave `require` off until iec104_authentications says the
        # associations are actually authenticating. The counter moves
        # whether or not the requirement is on, which is exactly so that
        # this decision can be made from evidence.
        #
        # authentication:
        #   require: true
        #   window: 5m

        # What the station may claim to have measured, and what to do
        # about the quality it attaches. Both of these *alert* by default
        # rather than refuse, and that is deliberate: a relay that refused
        # telemetry would blind the control room, which is its own kind of
        # incident and a worse one than an implausible reading reaching a
        # trend. An alert here does not reach the ban ladder either -- a
        # substation with a hand-entered reading is not an attacker.
        quality:
          # SB means a person typed the value in rather than an instrument
          # measuring it, and no HMI in the field shows the bit. IV is the
          # device saying not to trust itself, which on a substation with a
          # transducer out for maintenance is ordinary -- so it is named
          # here on purpose rather than by default.
          alert_on: [substituted, invalid]

        measurements:
          # The same points the setpoints below bound, read the other way:
          # the boiler pressure transmitter is a 0..40 bar instrument, so a
          # reading of 900 is a broken transmitter or a forged frame.
          - name: pressure
            points: ["5000-5009"]
            min: 0
            max: 40

        # The protocol's own replay check, and the one nothing in
        # IEC 60870-5-104 makes anybody perform: a time-tagged command
        # replayed an hour later carries the hour-old timestamp with it, and
        # a station that does not compare it against its clock opens the
        # breaker again.
        #
        # These refusals are hard -- shadow mode does not carry them --
        # because a command forwarded so that its age could be written down
        # is a moved actuator. The comparison is against this relay's clock,
        # so turning it on is a decision to have time discipline across the
        # estate: see the ntp listener kind for the other half of that.
        timestamps:
          max_command_age: 20s
          max_command_future: 5s
          deny_invalid: true

        # And what those setpoints may be set *to*. The rule above says
        # which workstation may write which points; these say what the
        # process will accept, which is the bound no rule about type
        # identifications can express: a scaled setpoint carries anything
        # from -32768 to 32767, and the RTU writes whatever arrives.
        #
        # The first bound that covers a point decides, so the narrow ones
        # come first.
        setpoints:
          # The boiler pressure reference, in bar, scaled: it lives
          # between 0 and 40 and moves by at most 5 at a time. A jump is
          # refused even from a client the rule allows, because a
          # workstation that may nudge a setpoint is not a workstation
          # that may slam it to the end of its range.
          - name: pressure
            points: ["5000-5009"]
            types: [C_SE_NB_1]
            min: 0
            max: 40
            max_delta: 5
            # Nothing may be moved blind: until the relay has seen this
            # point's value, a command that needs a step check is held.
            # One interrogation is usually all it takes.
            on_unknown: refuse

          # A voltage reference as a short float, in kilovolts.
          - name: voltage
            points: ["5010-5019"]
            types: [C_SE_NC_1]
            min: 130.0
            max: 145.0
            max_delta: 2.0

          # The normalised points, and the reason they are separate: a
          # C_SE_NA_1 value is a *fraction of full scale*, from -1 to
          # nearly +1, and the full scale is configured in the device
          # where this relay cannot see it. So this bound is written in
          # fractions -- 0 to 0.9 of whatever the RTU's span is -- and
          # writing 0 to 40 here would be a bound nothing could exceed.
          - name: normalised-references
            points: ["5020-5099"]
            types: [C_SE_NA_1]
            min: 0
            max: 0.9
            max_delta: 0.05

        log_commands: true
        alert_on_deny: true

    # ---------------------------------------------------------------
    # A neighbouring utility's data link: telemetry out, nothing in.
    # monitor_only is the shorthand, and no rule can override it — a
    # monitor-only listener that one rule could command through is not a
    # monitor-only listener.
    # ---------------------------------------------------------------
    - name: interchange
      address: "10.40.0.11:2404"
      kind: iec104
      iec104:
        upstream: rtu-a
        allow_clients: ["198.51.100.0/24"]
        common_addresses: ["1"]
        monitor_only: true
        default_action: allow
        allow_controls: [STARTDT_act, TESTFR_act]
        rate_limit: 200
        rate_burst: 400

    # ---------------------------------------------------------------
    # IEC 62351-3: TLS from the first octet, on the standard's own port.
    # This is the one part of IEC 104 with any security in it, and a
    # relay is where a substation gateway that will never speak TLS can
    # still be put behind it: the centre's leg is authenticated, the
    # station's leg is the plain protocol on a segment nobody else is on.
    # ---------------------------------------------------------------
    - name: substation-b-secure
      address: "10.40.0.12:2404"
      kind: iec104
      tls:
        certificates:
          - {cert_file: /etc/xproxy/tls/relay.pem, key_file: /etc/xproxy/tls/relay-key.pem}
        client_auth: require
        client_ca_file: /etc/xproxy/tls/control-centre-ca.pem
        min_version: "1.3"
        expiry: {refuse_expired: true, warn: 336h}
      iec104:
        upstream: rtu-b
        tls_mode: implicit
        upstream_tls_mode: none
        common_addresses: ["2"]
        require_select: true
        default_action: deny
        rules:
          - {name: telemetry, action: allow, class: [monitoring]}
          - {name: interrogation, action: allow, types: [C_IC_NA_1], causes: [act]}
          - name: switching
            action: allow
            types: [C_SC_NA_1, C_DC_NA_1]
            addresses: ["4000-4099"]
            causes: [act, deact]

    # ---------------------------------------------------------------
    # A new policy, evaluated and not enforced. Every refusal it would
    # have made is recorded and nothing is refused for policy, which is
    # how an operator finds out what a command policy would have broken
    # before it breaks it. The integrity checks — malformed frames, the
    # rate limits, the sequence numbering — are never shadowed.
    # ---------------------------------------------------------------
    - name: substation-c-trial
      address: "10.40.0.13:2404"
      kind: iec104
      policy: {mode: shadow}
      iec104:
        upstream: rtu-c
        common_addresses: ["3"]
        require_select: true
        default_action: deny
        rules:
          - {name: telemetry, action: allow, class: [monitoring]}
          - {name: switching, action: allow, types: [C_SC_NA_1], addresses: ["4000-4099"]}

    # ---------------------------------------------------------------
    # A substation that is not there: an address in the control centre's
    # own range with no station behind it at all.
    #
    # The reason it earns its place on a grid network is the shape of a
    # scan here. The common address is two octets and a centre names it in
    # every ASDU, so a relay that refuses the addresses it does not carry
    # has published the substation list; the interrogation that follows
    # each answer publishes the point list. This listener answers, so the
    # sweep finishes with the wrong map — and anything that arrives here
    # arrived somewhere nothing operational lives.
    #
    # tripwire names the points nothing legitimate reads. They are
    # answered, because the answer is what keeps the visitor reading, and
    # raised as iec104_tripwire, which is the event to act on.
    # ---------------------------------------------------------------
    - name: substation-spare
      address: "10.40.0.41:2404"
      kind: iec104
      iec104:
        deception:
          mode: decoy
          profile: generic-substation
          common_addresses: ["1-4"]
          tripwire: ["9000-9099"]
        log_commands: true
        alert_on_deny: true

    # ---------------------------------------------------------------
    # And the other shape, on a listener that fronts a real station: a
    # client on the network that has no business commanding anything gets
    # its refusals confirmed instead of refused.
    #
    # The bound on this is a test and not an intention: a frame that was
    # going to reach the station is never answered from here. Deception
    # replaces the negative confirmation a refusal would have sent, so
    # the worst case is a centre told "no" in a way that looks like
    # "yes" — never an operator reading a fabricated measurement off a
    # real point. mode: answer will not load without clients.
    # ---------------------------------------------------------------
    - name: substation-d-decoyed
      address: "10.40.0.14:2404"
      kind: iec104
      iec104:
        upstream: rtu-c
        common_addresses: ["3"]
        monitor_only: true
        default_action: allow
        deception:
          mode: answer
          clients: ["10.40.9.0/24"]
          tripwire: ["9000-9099"]

upstreams:
  - name: rtu-a
    endpoints: [{address: "10.40.2.10:2404"}]
    health_check: {type: tcp, interval: 10s, timeout: 3s}
  - name: rtu-b
    endpoints: [{address: "10.40.2.11:2404"}]
    health_check: {type: tcp, interval: 10s, timeout: 3s}
  - name: rtu-c
    endpoints: [{address: "10.40.2.12:2404"}]
    health_check: {type: tcp, interval: 10s, timeout: 3s}

# Repeated refusals from one address are a probe, and on this protocol a
# probe is somebody enumerating a substation's point list.
bans:
  action: drop
  triggers:
    - name: iec104-probing
      reasons: [iec104_denied]
      threshold: 10
      window: 5m
      duration: 1h
