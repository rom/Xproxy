# Modbus, in both directions, in front of equipment that cannot be
# patched.
#
# Modbus has no authentication, no integrity and no session. A frame says
# which device it is for, what to do and where, and the device does it.
# The devices cannot be fixed — a decade old, the vendor is gone, and the
# process they run does not stop — so the only place a policy can exist is
# in the path, and it has to be written in Modbus's own terms: the unit
# identifier, the function code, the register range and the value.
#
# Three listeners:
#   plant   — reverse: the masters and the historian reach the PLCs
#             through it (port 502)
#   secure  — the same, with Modbus/TCP Security: TLS with mutual
#             authentication and a role in the client certificate (802)
#   egress  — forward: the plant's own masters reach a device at another
#             site, and the routes say which destinations exist at all
#
# Validate: xot -config examples/ot/modbus.yaml -validate
version: 1
server:
  listeners:
    # ---------------------------------------------------------------
    # Reverse: masters connect here, the relay dials the PLC.
    # ---------------------------------------------------------------
    - name: plant
      address: "10.30.0.10:502"
      kind: modbus
      modbus:
        upstream: plc_line1
        framing: tcp

        # The control network, and nothing else. Modbus/TCP on an open
        # port is a PLC on an open port.
        allow_clients:
          - "10.30.1.0/24"       # engineering workstations
          - "10.30.2.0/24"       # the SCADA masters
          - "10.30.3.7/32"       # the historian
        deny_clients:
          - "10.30.1.99/32"      # the contractor's laptop, until it is not

        # The unit identifiers this line actually has. A frame for unit
        # 99 is a frame nobody meant to send.
        units: ["1-8"]

        # A gateway multiplexing three devices onto one address: unit 5
        # is the old drive behind a terminal server, which speaks RTU
        # and answers only to slave address 1.
        routes:
          - {name: line1, units: ["1-4"], upstream: plc_line1}
          - {name: drive, units: ["5"], upstream: drive_serial, framing: rtu, unit_override: 1}
          - {name: line2, units: ["6-8"], upstream: plc_line2}

        # First match wins. An observe rule records and keeps looking,
        # which is how a rule is tried on live traffic before it decides.
        rules:
          # The historian reads and never writes. read_only would say
          # the same thing for the whole listener; this says it for one
          # client, on the listener the masters also use.
          - name: historian
            action: allow
            clients: ["10.30.3.7/32"]
            access: [read, identify]
            addresses: ["0-1999"]
            max_quantity: 125
            comment: "change 2024-114: historian scan"

          # The masters write setpoints, inside the range the process
          # engineer signed off, and only values that range can hold.
          - name: setpoints
            action: allow
            clients: ["10.30.2.0/24"]
            functions: [write_single_register, write_multiple_registers]
            addresses: ["400-499"]
            write_addresses: ["400-499"]
            values:
              # A range is what may be written; the rest is what may
              # happen. A percentage setpoint may be nudged and not
              # jumped, and not more than once a minute -- a master
              # moving it sixty times a minute is either broken or not
              # the master it claims to be.
              - registers: "400-449"
                min: 0
                max: 100                     # percent
                max_delta: 10
                rate: {max: 1, period: 1m}
              - {registers: "450-499", min: -50, max: 250, signed: true}  # degrees
            comment: "change 2024-118: setpoint window"

          # The pump may be stopped by the operators at any time and
          # started only during the shift, which is two rules because it
          # is two decisions.
          - name: stop-pump
            action: allow
            clients: ["10.30.2.0/24"]
            functions: [write_single_coil]
            values: [{registers: "10", coils: false}]
          - name: start-pump
            action: allow
            clients: ["10.30.2.0/24"]
            functions: [write_single_coil]
            values:
              # Starting the pump is the operation this plant confirms:
              # register 11 has to have been set to 1 within the last
              # half minute, which is select-before-operate enforced
              # here rather than hoped for in the client. And once a
              # minute, because a coil cycled faster than that is not an
              # operator.
              - registers: "10"
                coils: true
                rate: {max: 1, period: 1m}
                require_before: {registers: "11", equals: 1, within: 30s}
          - name: pump-permissive
            action: allow
            clients: ["10.30.2.0/24"]
            functions: [write_single_register]
            addresses: ["11"]
            values: [{registers: "11", min: 0, max: 1}]
            schedule:
              days: [mon, tue, wed, thu, fri]
              from: "06:00"
              to: "18:00"
              timezone: Europe/Stockholm

          # Engineering may read anything and write nothing from here;
          # writing is what the secure listener below is for.
          - name: engineering-reads
            action: allow
            clients: ["10.30.1.0/24"]
            access: [read, identify]

          # Function code 8 is not one thing. Sub-function 11 returns a
          # bus message count, which a maintenance tool polls all day;
          # sub-function 4 is Force Listen Only Mode, which is four
          # bytes that take the device off the bus until somebody walks
          # out to it. So the deny goes first and names them, and the
          # allow names the counter block by range.
          - name: no-listen-only
            action: deny
            diagnostics: [force_listen_only, restart_communications,
                          clear_counters, clear_overrun_counter]
            comment: "one frame and the device stops answering"
          - name: diagnostic-counters
            action: allow
            clients: ["10.30.1.0/24"]
            functions: [diagnostic]
            diagnostics: ["11-18"]
            comment: "the read-only counters, from the maintenance network"

          # Function code 90 is Schneider's UMAS: the protocol the
          # engineering station speaks to a Modicon PLC. It is one code
          # carrying a variable read, a PLC stop and a program download,
          # so the policy is written per command. Reading is allowed from
          # the engineering network and nothing that changes the PLC is
          # allowed from anywhere -- a program change goes through the
          # plant's change process, at the panel, not over the relay.
          - name: umas-reads
            action: allow
            clients: ["10.30.1.0/24"]
            functions: [umas]
            umas_commands: [init_comm, keep_alive, take_plc_reservation,
                            release_plc_reservation, read_id,
                            read_plc_info, read_variables]
          - name: nothing-that-stops-a-plc
            action: deny
            effects: [control, program, clear, unknown]
            comment: "stop, start, block transfer, and the CANopen tunnel"

        default_action: deny
        # A master reads an exception as the device's own refusal and
        # carries on, which is what an operator wants at 3am.
        deny_response: exception

        # The audit trail a plant is asked for is per frame, not per
        # session: "who wrote what, when" is a frame.
        log_frames: true
        alert_on_deny: true

        max_connections: 64
        max_pending: 8
        idle_timeout: 120s
        request_timeout: 3s
        connect_timeout: 2s
        max_frame_bytes: 260

        # A PLC's scan budget is finite: a master asking faster than the
        # device can answer is an outage with no attacker in it.
        rate_limit: 100
        rate_burst: 200

        proxy_protocol: false

    # ---------------------------------------------------------------
    # Modbus/TCP Security: TLS with mutual authentication and the role
    # the client certificate carries. Port 802, TLS from the first
    # octet — there is no in-band upgrade to negotiate.
    # ---------------------------------------------------------------
    - name: secure
      address: "10.30.0.10:802"
      kind: modbus
      tls:
        certificates:
          - {cert_file: /etc/xproxy/certs/modbus.pem, key_file: /etc/xproxy/certs/modbus-key.pem}
        min_version: "1.2"
        client_auth: require
        client_ca_file: /etc/xproxy/certs/plant-ca.pem
      modbus:
        upstream: plc_line1
        tls_mode: implicit
        allow_clients: ["10.30.1.0/24", "10.30.2.0/24"]
        units: ["1-8"]

        security:
          # require is what the specification describes: a client with
          # no usable role does not get to send a frame.
          mode: require
          # The x.509 extension under the Modbus arc. cn and ou read the
          # subject instead, which trusts whoever issues certificates to
          # keep to a naming convention.
          role_source: extension
          roles: [operator, engineer, maintenance]
          require_client_cert: true

        rules:
          - {name: operators-read, action: allow, roles: [operator], access: [read, identify]}
          - name: operators-setpoints
            action: allow
            roles: [operator]
            functions: [write_single_register]
            addresses: ["400-449"]
            values: [{registers: "400-449", min: 0, max: 100}]
          - name: engineers
            action: allow
            roles: [engineer]
            access: [read, write, identify]
            addresses: ["0-1999"]
          # Inside the window a restart is legitimate and listen-only
          # mode still is not: a device nobody can talk to is the same
          # outage on a Sunday. So the restart is allowed by name, before
          # the general maintenance rule -- which names `diagnostic` and
          # therefore permits none of the sub-functions that stop a
          # device, including this one.
          - name: maintenance-restart
            action: allow
            roles: [maintenance]
            diagnostics: [restart_communications]
            schedule: {days: [sat, sun], from: "22:00", to: "04:00", timezone: Europe/Stockholm}
            comment: "a restart during the window, by name"
          - name: maintenance-window
            action: allow
            roles: [maintenance]
            access: [read, write, diagnostic, identify]
            schedule: {days: [sat, sun], from: "22:00", to: "04:00", timezone: Europe/Stockholm}
            comment: "the planned window; the counters, not the sub-functions that stop a device"
          - {name: maintenance-reads, action: allow, roles: [maintenance], access: [read, identify]}

        default_action: deny
        log_frames: true

        # The device behind this listener speaks Modbus/TCP Security
        # too, so the TLS does not stop at the relay.
        upstream_tls_mode: implicit
        upstream_tls:
          server_name: plc1.plant.internal
          ca_file: /etc/xproxy/certs/plant-ca.pem
          min_version: "1.2"

    # ---------------------------------------------------------------
    # Forward: the plant's masters reach a device at another site. The
    # routes are the whole point — a unit with no route has nowhere to
    # go, and inventing a destination is the one thing an egress
    # gateway must not do.
    # ---------------------------------------------------------------
    - name: egress
      address: "10.30.0.10:5020"
      kind: modbus
      modbus:
        mode: forward
        framing: tcp
        allow_clients: ["10.30.2.0/24"]
        routes:
          - {name: substation, units: ["20-21"], upstream: substation}
        # read_only cannot be overridden by a rule, which is what makes
        # "this path never writes" a property rather than a hope.
        read_only: true
        rules:
          - {name: substation-reads, action: allow, units: ["20-21"], access: [read], addresses: ["0-499"]}
        default_action: deny
        log_frames: true
        request_timeout: 5s

        # The frames this listener was going to refuse are answered by a
        # fabricated device instead -- but only for the one network that
        # has no business here at all. A frame on its way to a real
        # device is never answered this way, which is what keeps a
        # fabricated value off an operator's screen.
        deception:
          mode: answer
          clients: ["10.30.1.99/32"]   # the contractor's laptop
          units: ["1-32"]

        # Behavioural detection, which needs no rules at all. A master's
        # scan cycle is the same handful of function codes over the same
        # handful of registers every cycle for years, so "this client has
        # never done this before" is a real signal here -- and a burst of
        # writes across forty different registers is not a rate violation
        # anywhere, which is exactly why it is worth watching.
        #
        # Left as alert, deliberately. The signal is novelty, and the
        # first legitimate maintenance write of the year is novel too; the
        # events are what somebody reads, and the rules above are what
        # refuse. A quarter of an hour of settling because this plant's
        # masters run a recipe download when they reconnect, and none of
        # that is what they do for the rest of the year.
        anomaly:
          enabled: true
          settle: 15m
          write_burst: 30          # this plant downloads recipes
          burst_period: 10s

        # An afternoon's trace during a commissioning. The data bytes
        # are process data, so they are off.
        trace:
          file: /var/log/xproxy/modbus-egress.jsonl
          max_bytes: 268435456
          include_data: false
          requests: true
          responses: true

    # ---------------------------------------------------------------
    # A device that is not there.
    #
    # An address on the plant network with no PLC behind it. Anything
    # speaking Modbus to it is lost or looking, and an honest relay would
    # have told a scanner exactly that by refusing -- so this one answers
    # as a controller instead. The scan completes and the map is wrong.
    #
    # The identity matters: it should be the make this plant runs. A
    # profile claiming another vendor's controller is the tell that ends
    # the pretence, and only the plant knows which it is.
    # ---------------------------------------------------------------
    - name: cell4-spare
      address: "10.30.0.41:502"
      kind: modbus
      modbus:
        # No upstream and no routes: there is nothing behind this, which
        # is the one shape where that is not a missing field.
        default_action: allow
        deception:
          mode: decoy
          profile: generic-plc
          vendor: "Plant Systems"      # …the make this line actually runs
          product: "PS-1200"
          revision: "V2.6"
          units: ["1-4"]               # four devices, not 247

          # Registers nothing on this plant reads. The read is answered,
          # which keeps the visitor reading; the modbus_tripwire event is
          # what somebody is woken for, and it has no false positives,
          # because nothing legitimate touches them.
          tripwire: ["9000-9099"]

          # How the address space behaves. Getting this wrong is what
          # gives a decoy away: a totaliser that goes backwards, or a
          # measurement that swings across its range every minute.
          bands:
            - {addresses: "0-999", shape: analogue, min: 0, max: 27648}
            - {addresses: "1000-1999", shape: discrete}
            - {addresses: "2000-2099", shape: counter, rate: 3}

upstreams:
  - name: plc_line1
    endpoints: [{address: "10.30.10.11:502"}]
    # One device, one connection at a time: a Modbus slave has one scan.
    timeouts: {connect: 2s}
  - name: plc_line2
    endpoints: [{address: "10.30.10.12:502"}]
    timeouts: {connect: 2s}
  - name: drive_serial
    # A terminal server with the old drive on its serial port.
    endpoints: [{address: "10.30.10.50:4001"}]
    timeouts: {connect: 2s}
  - name: substation
    endpoints: [{address: "10.40.0.5:502"}]
    timeouts: {connect: 5s}

bans:
  triggers:
    # A master does not probe function codes. Something walking them is
    # either broken or not a master.
    - name: modbus-abuse
      reasons: [modbus_denied]
      threshold: 5
      window: 10m
      duration: 1h

logging:
  access: {enabled: true}
