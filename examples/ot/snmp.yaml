# SNMP relay: the management protocol that runs every switch, printer and
# building controller in an estate, put behind something that can refuse a
# write.
#
# The problem this configuration solves is the oldest one in network
# management. SNMP v1 and v2c authenticate with a community string: a
# cleartext password in every datagram, "public" to read and "private" to
# write on anything nobody reconfigured, with no integrity, no replay
# protection and no confidentiality. One datagram reads a device's whole
# configuration; one changes it. v3 has a real security model and also has
# noAuthNoPriv, which is v2c with more fields.
#
# The devices cannot be fixed. They are switches, printers and building
# controllers with firmware nobody ships updates for, so the relay is the
# only place a policy can live:
#   - which addresses may send at all (allow_clients) — on this protocol
#     the network list is the credential and the community string is a label
#   - which versions, credentials and security levels are accepted
#   - that nothing writes (read_only), which no rule can override
#   - which objects may be named at all (rules, oids, deny_oids)
#   - that a GETBULK cannot be used as an amplifier (max_repetitions,
#     max_response_bytes, max_response_ratio)
#   - that an answer nobody asked for never reaches a manager
#   - and, with usm_users, what is inside a v3 message at all: without the
#     user's pass phrases an authPriv payload is ciphertext, so every rule
#     about an operation or an object subtree would apply to v2c and not to
#     the version an operator is told to insist on
#
# Validate with: xproxyctl -config examples/ot/snmp.yaml validate
version: 1

logging:
  directory: /var/log/xproxy
  access: {file: access.log}
  security: {file: security.log}
  audit: {file: audit.log}

management:
  socket: /run/xproxy/mgmt.sock
  socket_mode: "0660"

server:
  listeners:
    # ---------------------------------------------------------------
    # The polling front: the monitoring system sends here, the relay
    # forwards to the switches.
    #
    # This listener takes datagrams (transport: udp, the default, which is
    # what every poller and every agent actually speaks) and also the
    # streams of RFC 3430 on the same port.
    # ---------------------------------------------------------------
    - name: poll
      address: "10.50.0.10:161"
      kind: snmp
      snmp:
        upstream: switches

        # The monitoring system, and nothing else. This is the second most
        # valuable line in the file, and on a protocol whose credential
        # travels in clear it is very nearly the first.
        allow_clients: ["10.50.1.0/24"]

        # v1 has no reason to exist on a network built this decade: it
        # cannot even report "you may not" without saying "no such object".
        versions: [v2c, v3]
        communities: [wJ8kq2vPzR]
        users: [monitor]
        # noAuthNoPriv is v2c with more fields, so a listener that went to
        # the trouble of requiring v3 asks for authentication with it.
        min_security_level: authNoPriv

        # The single most valuable line in the file. SNMP has exactly one
        # writing operation, so this covers the whole of "nobody
        # reconfigures anything through this relay" — and no rule below can
        # open a hole in it.
        read_only: true

        # The amplification bounds. A forty-octet GETBULK with a repetition
        # count of ten thousand asks for a response of megabytes, sent to
        # whatever address the datagram claimed to come from. A count past
        # this is *lowered* rather than the request refused, so a poller
        # nobody can reconfigure still gets an answer.
        max_repetitions: 50
        max_var_binds: 64
        # And the other half, on the way back: an agent that ignores the
        # repetition count still cannot get past a size bound, and the
        # ratio is the one that is about reflection rather than size.
        max_response_bytes: 8192
        max_response_ratio: 40

        # A poll is periodic and its rate is known, which makes this the
        # one protocol where a rate limit is easy to set correctly.
        rate_limit: 200
        rate_burst: 400

        max_message_bytes: 1472    # what fits an Ethernet datagram
        max_pending: 64
        request_timeout: 3s

        default_action: deny
        rules:
          # mib-2, which is what a monitoring system actually reads: system,
          # interfaces, ip, tcp, udp. The comparison is per sub-identifier,
          # so this covers 1.3.6.1.2.1.1.1.0 and does *not* cover
          # 1.3.6.1.2.11 — a policy written with string prefixes would.
          - name: mib-2
            action: allow
            access: [read]
            oids: ["1.3.6.1.2.1"]
            # Except the ARP table, which is a map of the network, and the
            # TCP connection table, which is a map of who talks to whom.
            deny_oids: ["1.3.6.1.2.1.4.22", "1.3.6.1.2.1.6.13"]

          # The vendor subtree the switches' own dashboards need, walked
          # rather than polled object by object, so it gets a higher
          # repetition bound of its own.
          - name: vendor-enterprise
            action: allow
            access: [read]
            oids: ["1.3.6.1.4.1.9"]
            max_repetitions: 200

          # Named so the security log says which one it was rather than
          # "default deny". The interface table's ifAdminStatus is a write
          # that takes a link down; the system group's sysName and
          # sysContact are writes that change what every other tool
          # believes about the device.
          - {name: no-interface-writes, action: deny, access: [write], oids: ["1.3.6.1.2.1.2"]}
          - {name: no-identity-writes, action: deny, access: [write], oids: ["1.3.6.1.2.1.1"]}

    # ---------------------------------------------------------------
    # The change window: one operator, one subtree, one shift.
    #
    # A listener of its own rather than a rule on the one above, because
    # read_only cannot be overridden by a rule and should not be: a
    # read-only listener that one rule could write through is not a
    # read-only listener. Giving the write its own address, its own client
    # list and its own credential is the shape that stays true.
    # ---------------------------------------------------------------
    - name: change
      address: "10.50.0.10:1161"
      kind: snmp
      snmp:
        upstream: switches
        allow_clients: ["10.50.1.10/32"]   # the one workstation
        versions: [v3]
        users: [netops]
        min_security_level: authPriv       # a write, so the payload is sealed too
        read_only: false
        max_repetitions: 25

        # The user's pass phrases, so this relay can *read* what it is
        # deciding about.
        #
        # This is the difference between a policy and the appearance of one.
        # An authPriv message's payload is ciphertext: without these, the
        # rules below could not see the operation or the object identifier,
        # and every one of them would apply to v2c and not to the version
        # this listener insists on. With them the digest is verified, the
        # payload is decrypted, and write_oids means something.
        #
        # They are the same pass phrases the workstation is configured with
        # — what snmpset's -A and -X take — because both ends derive the same
        # key from the pass phrase and the agent's engine identifier.
        # Nothing here is re-signed or re-encrypted: the octets that arrive
        # are the octets the switch receives.
        usm_users:
          - name: netops
            auth: sha256
            auth_secret: "file:/etc/xproxy/snmp/netops.auth"
            privacy: aes128
            privacy_secret: "file:/etc/xproxy/snmp/netops.priv"

        # RFC 3414's own replay window: a captured datagram sent again later
        # has a clock that has gone backwards, and 150s is the value the
        # standard names.
        replay_window: 150s
        default_action: deny
        rules:
          - name: descriptions
            action: allow
            # A wide read and a narrow write in one rule: write_oids
            # replaces the read list for a SetRequest rather than adding to
            # it.
            oids: ["1.3.6.1.2.1"]
            write_oids: ["1.3.6.1.2.1.1.5", "1.3.6.1.2.1.1.6", "1.3.6.1.2.1.31.1.1.1.18"]
            schedule: {days: [tue, thu], from: "09:00", to: "17:00", timezone: Europe/Stockholm}

    # ---------------------------------------------------------------
    # Traps, and the one version rewrite that works end to end.
    #
    # A modern device sends v3 notifications; the collector understands v2c
    # and never will. A notification has no answer, so downgrading it is a
    # complete translation rather than half of one — unlike a v3 *request*,
    # whose answer would have to be signed, which this relay never does,
    # and which is therefore refused rather than
    # half-translated.
    # ---------------------------------------------------------------
    - name: traps
      address: "10.50.0.10:162"
      kind: snmp
      snmp:
        upstream: collector
        traps: true
        allow_clients: ["10.50.2.0/23"]    # the equipment networks
        versions: [v3]
        min_security_level: authNoPriv
        upgrade_version: v2c
        # The collector's community string, which the devices never learn.
        upstream_community: kM4tz9LqXb
        max_var_binds: 128
        rate_limit: 500                    # an alarm storm is still bounded
        default_action: allow
        rules:
          # A link going up and down is telemetry; a device announcing a
          # cold start is an event somebody reads. Both pass; naming them
          # is what puts them in the access log with a rule beside them.
          - {name: standard-traps, action: allow, oids: ["1.3.6.1.6.3.1.1.5"]}
          - {name: vendor-traps, action: allow, oids: ["1.3.6.1.4.1"]}

    # ---------------------------------------------------------------
    # The upgrade the other way round: a poller that speaks v2c and never
    # will, in front of switches that were replaced and now speak only v3.
    #
    # The relay terminates the manager's security -- a community string,
    # which is a cleartext password -- and originates a version 3 session
    # of its own: authenticated, encrypted, with a pass phrase the poller
    # has never held. The credential that opens the switches lives in one
    # place, and v1 does not have to stay enabled on them for ever.
    #
    # What this costs is written down rather than discovered later: there
    # is no end-to-end authentication between the poller and the switch
    # any more. The poller authenticates to this relay (which is to say it
    # does not, because it sends a community string) and this relay
    # authenticates to the switch. Validation says so at load, once.
    #
    # The switch's engine identifier is not configured: it is the
    # switch's to state, and a message is authenticated against that
    # engine's clock. The first poll of a cold switch draws a discovery
    # and is asked properly as soon as the answer arrives.
    - name: legacy-poller
      address: "10.50.0.10:1162"
      kind: snmp
      snmp:
        upstream: switches
        allow_clients: ["10.50.1.20/32"]   # the one polling system
        versions: [v2c]
        communities: [legacy-monitoring]
        read_only: true
        upgrade_version: v3
        upstream_security_level: authPriv
        upstream_usm:
          name: xproxy-relay
          auth: sha256
          auth_secret: file:/etc/xproxy/snmp/relay-auth
          privacy: aes128
          privacy_secret: file:/etc/xproxy/snmp/relay-priv
        default_action: allow
        rules:
          # The same narrow reach the v3 listeners above have. Terminating
          # the security does not widen what may be asked.
          - {name: interfaces, action: allow, oids: ["1.3.6.1.2.1.2"]}
          - {name: system, action: allow, oids: ["1.3.6.1.2.1.1"]}

    # ---------------------------------------------------------------
    # RFC 6353, both halves: TLS on TCP 10161 and DTLS on UDP 10161, with
    # RFC 5591's transport security model inside either.
    #
    # This is the listener to read if the estate is trying to get off USM.
    # A transport security model message carries no user, no engine, no
    # clock and no digest: the session authenticated and encrypted it, and
    # what identifies the sender is the certificate its peer presented.
    # cert_to_name is RFC 6353 §5.3's table, which turns that certificate
    # into the name the rules name.
    #
    # Three things follow, and each is something USM cannot do:
    #   - the secret per user per engine is gone. A certificate is an
    #     identity this estate already issues, revokes and rotates, and
    #     client_ca_file is where it says which authority to believe
    #   - a refusal is answered rather than timing out, because there is no
    #     digest to forge: the session authenticates the answer
    #   - and a v3 request can be downgraded to v2c for the switches,
    #     because the answer needs no key either. That is upgrade_version
    #     below, and it is the one case where "a v3 request cannot be
    #     downgraded" does not apply
    #
    # transport: udp is what opens the datagram socket; the stream socket is
    # always there, so tls_mode and dtls_mode together are the whole of
    # RFC 6353 on one address. A management station that speaks the stream
    # half gets it, and one that speaks the datagram half -- which is what
    # this protocol actually runs on -- gets that.
    #
    # The certificate is what everything here rests on, so client_auth is
    # require with an authority beside it. `fingerprint: any` then means
    # "any certificate that authority issued", which is what makes this
    # file survive a renewal; a row naming one fingerprint is the standard's
    # own arrangement and is what to write for a certificate that must be
    # pinned.
    # ---------------------------------------------------------------
    - name: poll-6353
      address: "10.50.0.10:10161"
      kind: snmp
      tls:
        certificates:
          - {cert_file: /etc/xproxy/tls/snmp.crt, key_file: /etc/xproxy/tls/snmp.key}
        client_auth: require
        client_ca_file: /etc/xproxy/tls/nms-ca.pem
      snmp:
        upstream: switches
        tls_mode: implicit
        dtls_mode: implicit
        allow_clients: ["10.50.1.0/24"]
        read_only: true
        # Arriving as v3 under the transport security model, leaving as v2c
        # with the community string the switches expect and the managers
        # never learn.
        upgrade_version: v2c
        upstream_community: wJ8kq2vPzR
        # The name each certificate carries, from its subject alternative
        # name. A policy written against a DNS name is one an operator can
        # read against the estate's own inventory.
        cert_to_name:
          - {fingerprint: any, map: san_dns}
        # The bounds the datagram transport needs. A handshake is where a
        # peer that has proved nothing already costs a socket, a goroutine
        # and a slot in the peer table, so it is bounded tightly; the idle
        # bound is long because for a poller on a thirty-second cycle the
        # handshake is the expensive part of the exchange.
        dtls_handshake_timeout: 5s
        dtls_idle_timeout: 10m
        max_dtls_peers: 16
        max_repetitions: 50
        max_connections: 8
        idle_timeout: 300s
        default_action: deny
        rules:
          - name: nms
            action: allow
            transports: [tls, dtls]
            security_names: [nms1.ops.example.com, nms2.ops.example.com]
            access: [read]
            oids: ["1.3.6.1.2.1"]
            deny_oids: ["1.3.6.1.2.1.4.22", "1.3.6.1.2.1.6.13"]

    # ---------------------------------------------------------------
    # The migration, on one port.
    #
    # dtls_mode: detect takes records and plain datagrams on the same
    # socket, because a DTLS content type and a BER SEQUENCE cannot be read
    # as each other. It is not RFC 6353's arrangement -- the standard gives
    # DTLS a port of its own -- and it is here for the estate whose new
    # managers speak DTLS and whose two hundred field switches are not
    # going to be reconfigured to a new port.
    #
    # What it costs is that the client chooses which of the two it speaks,
    # so the *policy* is what requires the certificate. That is what
    # transports on a rule is for, and it is why default_action stays deny:
    # the new manager gets the wide read its certificate earns, the old
    # pollers keep the narrow one their address and community string always
    # had, and nothing reaches the switches under a rule it does not match.
    # ---------------------------------------------------------------
    - name: poll-migrating
      address: "10.50.0.12:161"
      kind: snmp
      tls:
        certificates:
          - {cert_file: /etc/xproxy/tls/snmp.crt, key_file: /etc/xproxy/tls/snmp.key}
        client_auth: require
        client_ca_file: /etc/xproxy/tls/nms-ca.pem
      snmp:
        upstream: switches
        dtls_mode: detect
        allow_clients: ["10.50.1.0/24", "10.50.3.0/24"]
        read_only: true
        cert_to_name:
          - {fingerprint: any, map: san_dns}
        max_repetitions: 50
        default_action: deny
        rules:
          # The new manager, by the name its certificate carries.
          - name: nms-dtls
            action: allow
            transports: [dtls]
            security_names: [nms1.ops.example.com]
            access: [read]
            oids: ["1.3.6.1.2.1"]
          # The field pollers, still sending plain v2c from the plant
          # network, still reading the interface table and nothing else.
          - name: field-pollers
            action: allow
            transports: [udp]
            clients: ["10.50.3.0/24"]
            versions: [v2c]
            communities: [wJ8kq2vPzR]
            access: [read]
            oids: ["1.3.6.1.2.1.2"]

    # ---------------------------------------------------------------
    # A shadow-mode trial of a narrower policy, on a copy of the traffic's
    # own address. Nothing is refused for policy here: the ledger records
    # what enforcing would have cost, which is the only honest way to find
    # out before an estate's monitoring breaks.
    #
    # The bounds are not part of that. A malformed message, a message past
    # max_message_bytes, an amplified response, an answer nobody asked for
    # and the rate limit are refused whatever the mode says — a relay whose
    # amplification bounds were in shadow mode would be a working
    # amplifier.
    # ---------------------------------------------------------------
    - name: poll-trial
      address: "10.50.0.11:161"
      kind: snmp
      policy: {mode: shadow}
      snmp:
        upstream: switches
        allow_clients: ["10.50.1.0/24"]
        versions: [v3]
        min_security_level: authPriv
        read_only: true
        max_repetitions: 25
        default_action: deny
        rules:
          - {name: system-only, action: allow, access: [read], oids: ["1.3.6.1.2.1.1"]}

    # ---------------------------------------------------------------
    # An agent that is not there: an address on the management network
    # with nothing on it.
    #
    # It earns its place here because of what a scan of this protocol
    # looks for. A community string that is wrong is refused and one that
    # is right is answered, so the refusal is the oracle a password list
    # needs; and the system group is the estate's own inventory, which
    # every scanner reads first. This listener answers as a switch
    # instead, and anything that arrives here arrived at an address
    # nothing operational uses.
    #
    # The identity should be what the estate's own switches say. A decoy
    # describing itself as something nobody on the site runs is the tell
    # that ends the pretence.
    #
    # The three bounds below are not decoration. A fabricated agent is a
    # UDP service answering a small request with a larger response, which
    # is what a reflection amplifier is, and they are what keep this a
    # sensor rather than a liability.
    # ---------------------------------------------------------------
    - name: sw-spare
      address: "10.50.0.41:161"
      kind: snmp
      snmp:
        transport: udp
        deception:
          mode: decoy
          profile: generic-switch
          sys_descr: "24-port managed Ethernet switch"
          sys_name: "sw-cell9"
          sys_location: "Cell 9, north wall"
          interfaces: 24
          # A vendor configuration branch nothing legitimate reads.
          tripwire: ["1.3.6.1.4.1.9.9.96"]
        max_repetitions: 25
        max_var_binds: 64
        max_response_bytes: 4096
        rate_limit: 20
        rate_burst: 40
        alert_on_deny: true

    # ---------------------------------------------------------------
    # And the other shape, on a listener that fronts real agents: a
    # client on the network that has no business polling gets its
    # refusals answered by a fabricated switch rather than told no.
    #
    # The bound is a test and not an intention: a request that was going
    # to reach the agent is never answered from here.
    # ---------------------------------------------------------------
    - name: poll-decoyed
      address: "10.50.0.42:161"
      kind: snmp
      snmp:
        transport: udp
        upstream: switches
        communities: ["${SNMP_POLL_COMMUNITY}"]
        default_action: deny
        deception:
          mode: answer
          clients: ["10.50.9.0/24"]
          sys_descr: "24-port managed Ethernet switch"
        max_repetitions: 25
        max_response_bytes: 4096

upstreams:
  - name: switches
    endpoints:
      - {address: "10.50.2.10:161"}
      - {address: "10.50.2.11:161"}
    # The datagram path picks one endpoint per message, and a health check
    # is what keeps it from picking a switch that is not answering. A UDP
    # probe has to send something an agent will answer, so it sends a real
    # v2c GET for sysDescr.0 with the community above.
    health_check:
      type: udp
      interval: 15s
      timeout: 3s
      send_hex: "302a020101040a774a386b713276507a52a019020101020100020100300e300c06082b060102010101000500"
  - name: collector
    endpoints: [{address: "10.50.3.10:162"}]
    # A trap collector answers nothing at all -- a notification has no
    # response -- so there is nothing to probe it with. A TCP check would
    # test a port it does not listen on. Left out on purpose.

# Repeated refusals from one address are a probe, and on this protocol a
# probe is somebody trying community strings: the defaults first, then a
# list. Ten refusals in five minutes is not a misconfigured tool.
bans:
  action: drop
  triggers:
    - name: snmp-community-guessing
      reasons: [snmp_denied]
      threshold: 10
      window: 5m
      duration: 1h
