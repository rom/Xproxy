# Maintenance mode: hold the site behind a 503 for everyone but the
# office network and a health check, toggled at runtime with
# `xproxyctl maintenance on`. The health route stays up so load
# balancers still see the node.
#
# Validate: xproxy -config examples/routes/maintenance.yaml -validate
version: 1
server:
  listeners:
    - {name: main, address: "0.0.0.0:8080"}
management:
  socket: /run/xproxy/mgmt.sock
logging:
  directory: /var/log/xproxy
maintenance:
  enabled: false
  status: 503
  retry_after: 10m
  message: "Xproxy: scheduled maintenance, back shortly."
  allow_cidrs: [10.0.0.0/8]
  allow_header: "X-Maintenance-Bypass: change-me"
upstreams:
  - name: app
    endpoints: [{address: "10.0.0.10:8080"}]
routes:
  - {name: health, hosts: [app.example.com], paths: [/healthz], upstream: app, maintenance: false}
  - {name: app, hosts: [app.example.com], upstream: app}
