# Include fragment: routes with a CIDR deny list for known scanner ranges
# (illustrative documentation prefixes) in front of every host, plus a
# management network allow list for the admin path.
#
# Main file:
#   includes: [/etc/xproxy/conf.d/*.yaml]
# This fragment names the upstream "web" defined in the main file.
routes:
  - name: admin
    hosts: [www.example.com]
    paths: [/admin/]
    allow_cidrs: [10.0.0.0/8, 192.168.10.0/24]
    upstream: web
  - name: web-blocked-ranges
    hosts: [www.example.com]
    deny_cidrs:
      - 192.0.2.0/24        # TEST-NET-1: replace with the ranges you see in the security log
      - 198.51.100.0/24     # TEST-NET-2
      - 203.0.113.0/24      # TEST-NET-3
      - 2001:db8::/32       # documentation prefix
    upstream: web
