# DNS listener with a block list file, sinkhole action and DNSSEC
# validation. Validate: xproxy -config examples/blocklists/dns.yaml -validate
version: 1
server:
  listeners:
    - name: dns
      kind: dns
      address: "0.0.0.0:53"
      dns:
        upstreams: ["tls://9.9.9.9:853", "tls://149.112.112.112:853"]
        allow_clients: [10.0.0.0/8, 192.168.0.0/16, fd00::/8]
        block:
          - ads.example.net
          - "*.tracking.example.org"
        block_file: /etc/xproxy/dns-blocklist.txt
        block_action: sinkhole
        sinkhole_ipv4: 10.255.255.254
        dnssec: {enabled: true}
        cache:
          max_entries: 50000
          max_ttl: 6h
          # An upstream outage should not take the network with it: an
          # expired answer is worth more than a SERVFAIL for an hour.
          serve_stale: 1h
          # And the names in use stay current without a client waiting
          # for the upstream once per TTL.
          prefetch: true
        # Where an answer may point. A block list cannot express this:
        # rebinding and the cloud metadata endpoint are ordinary names
        # answering an address they have no business answering.
        answer_policy:
          deny_private: true
          allow: [10.0.0.0/8]          # this network's own range
          allow_names: ["corp.example.net"]
          action: nxdomain
        # The client's subnet is not forwarded: the cache is keyed by
        # the question alone, so a per-subnet answer would be served to
        # every client of this listener.
        ecs: strip
        # A cookie makes a UDP client prove it can receive what it asked
        # for, which is what makes its security events attributable and
        # bannable. respond never refuses a client that has no cookies.
        cookies: respond
        # Split horizon: the same name, a different answer by who asked.
        # Order is the policy -- the laboratory is inside 10.0.0.0/8 too,
        # so it is listed first or it never matches.
        views:
          - name: lab
            clients: [10.9.0.0/16]
            records:
              - {name: app.example.com, type: a, address: 10.9.0.20, ttl: 60}
          - name: estate
            clients: [10.0.0.0/8, 192.168.0.0/16]
            records:
              - {name: app.example.com, type: a, address: 10.0.5.10}
              - {name: app.example.com, type: aaaa, address: "2001:db8::5"}
              - {name: app.example.com, type: txt, text: "owner=platform"}
          # The guest network is held to a stricter list than the staff
          # network, and sinkholed rather than told NXDOMAIN so that a
          # captive portal has somewhere to answer.
          - name: guest
            clients: [192.168.50.0/24]
            block: ["*.social.example", "tracker.example"]
            block_action: sinkhole
            sinkhole_ipv4: 192.0.2.1
management:
  socket: /run/xproxy/mgmt.sock
logging:
  directory: /var/log/xproxy
bans:
  action: drop
  triggers:
    - {name: dns-abuse, reasons: [dns_blocked, dns_bogus, dns_answer_denied], threshold: 50, window: 1m, duration: 1h}
