# An SSH bastion that reads the session: RFC 4251-4254, with SFTP
# (draft-ietf-secsh-filexfer-02, version 3) inspected inside it.
#
# A jump host that forwards the stream cannot see which channel is a
# shell and which is a port forward, so the only policy it can hold is
# "may connect". Here the proxy is an SSH server to the client and an
# SSH client to the target, so every channel and every request inside
# the session is a decision.
#
# It also means the target never sees the client's key. The client
# authenticates to the bastion; the bastion authenticates to the target
# with a credential no client holds. A key that leaves the estate on a
# laptop is then not a key that opens a server in it.
#
# Validate: xproxy -config examples/bastion/ssh.yaml -validate
version: 1
server:
  listeners:
    # Operators: a shell, commands, and port forwards to the databases.
    - name: bastion
      address: "0.0.0.0:22"
      kind: ssh
      # A key exchange is expensive and happens before the bastion
      # knows who is calling, so a client that connects and drops costs
      # more than one that stays. max_sessions bounds how many are open;
      # this bounds how fast they arrive, which is the other half.
      connection_rate: {per_second: 20, burst: 40}
      connection_rate_per_source: {per_second: 2, burst: 5}
      ssh:
        upstream: hosts

        # The bastion's own identity. Clients pin it, so replacing it is
        # a fleet-wide known_hosts change: add the new key beside the
        # old one, let clients learn it, then remove the old one.
        host_keys:
          - /etc/xproxy/ssh/host_ed25519
          - /etc/xproxy/ssh/host_rsa

        authorized_keys: /etc/xproxy/ssh/authorized_keys

        banner: |
          Access to this system is logged. Disconnect now if you are not
          authorised to use it.

        max_auth_tries: 3
        max_sessions: 500
        max_channels: 8
        handshake_timeout: 20s
        idle_timeout: 30m
        session_timeout: 12h

        allow_channels: [session, direct-tcpip]
        # x11-req and auth-agent-req are left out: each hands whatever
        # runs on the target a channel back into the client, and agent
        # forwarding lets it sign with the client's keys for as long as
        # the session lasts.
        allow_requests: [pty-req, env, shell, exec, subsystem, window-change, signal]
        allow_subsystems: [sftp]

        # What a client may put in the target's environment. Everything
        # else is refused with the request. The loader and interpreter
        # variables are refused whatever this says: LD_PRELOAD or
        # BASH_ENV is code that runs before the command the policy
        # approved, so allow_commands would be decoration.
        allow_env: [TERM, LANG, "LC_*"]

        # scp and rsync move files without ever opening the sftp
        # subsystem, so an sftp policy says nothing about them. This
        # switch is the blunt answer -- yes or no -- and on this
        # listener the rules below are the sharp one, so what it admits
        # is only what no rule covers.
        allow_file_transfer_commands: true

        # What the transfer commands may actually do. A pattern over the
        # command line cannot say this: "^scp -t /srv/incoming$" is
        # somebody meaning "uploads into that directory", and
        # "scp -f /srv/incoming" (the other way, the same words),
        # "scp -rt /srv/incoming" (bundled flags), "/usr/bin/scp -t ..."
        # (a path) and "scp -t /srv/incoming/../../etc/ssh" each walk
        # past it. So the line is split as a shell splits it, the flags
        # are read as scp and rsync read them, and the rule decides on
        # the meaning: direction, recursion, deletion, path.
        #
        # Once there is one rule, a family with no rule is refused, so
        # this list is the whole answer for scp, rsync, git and the sftp
        # server binary. Everything else is still allow_commands.
        command_rules:
          - command: scp
            directions: [upload]
            paths: ["/srv/incoming/**"]
            # A directory somebody's own keys live in is not a place an
            # upload belongs.
            deny_paths: ["/srv/incoming/.ssh/**"]
          # Backups pull, and may not delete what they pull from: the
          # --delete family and --remove-source-files stay refused.
          - command: rsync
            directions: [download]
            paths: ["/srv/data/**"]
          # Clones and fetches, no pushes. The direction is the file
          # movement, not git's own verb: a fetch is "upload-pack"
          # because that name is the server's.
          - command: git
            directions: [download]
            paths: ["/srv/git/**"]

        # Certificates instead of a growing authorized_keys: the CA
        # signs a principal into a certificate with a lifetime, and the
        # bastion checks the signature, the window and that the
        # principal list covers the login.
        #
        # What else the certificate says is read too. source-address
        # restricts it to a network, force-command fixes what the
        # session runs (and the client's own command is replaced by it),
        # and the extensions are permissions whose absence is a denial:
        # a certificate issued with "-O clear -O permit-pty" gets a
        # terminal and no port forward, whatever allow_channels says.
        trusted_user_ca_keys: /etc/xproxy/ssh/user_ca.pub

        # A certificate cannot be un-issued, so the estate needs a way
        # to take one back before it expires. A key here is refused
        # whatever the CA says; the CA's own key here takes back
        # everything it ever signed.
        revoked_keys: /etc/xproxy/ssh/revoked_keys

        # The point of certificates is that they expire. A CA issuing
        # for a year has made a credential nobody can take back for a
        # year, so this listener will not take one.
        max_certificate_lifetime: 12h

        # max_sessions is the fleet's. This is one person's, so the
        # delivery robot looping connections cannot take the bastion
        # from the on-call engineer.
        max_sessions_per_principal: 8
        # A session that may forward at all can otherwise open one
        # forward per descriptor this process has.
        max_forwards: 8
        # One key for a whole working day is one key for a whole working
        # day of recorded traffic.
        rekey_bytes: 1073741824

        # One policy for everyone in authorized_keys means the delivery
        # robot may run what the on-call engineer may run. Each entry
        # says who it covers and what changes; the rest of this
        # listener is what it leaves unset.
        principals:
          # The robot holds one key, runs one command, and reaches the
          # target as an account that owns nothing else.
          - name: deploy-bot
            fingerprints: ["SHA256:2nFf3v0mP7nMZcRe0KQ1ZFQ5t3aJH2c7pXoLdW8yqQk"]
            policy:
              upstream_user: ci
              allow_channels: [session]
              allow_requests: [exec]
              allow_commands: ["^/usr/local/bin/deploy( |$)"]
              allow_env: ["DEPLOY_*"]
              forward: []
              # The robot prints deploy logs by the megabyte and types
              # nothing back. Recording it would fill a disk with what
              # the deploy log already holds.
              recording: {enabled: false}

          # The on-call rota, by certificate: the CA decides who is in
          # it this week, and nothing here changes when they do.
          - name: on-call
            cert_principals: [oncall]
            policy: {upstream_user: operator}

          # A key stays in authorized_keys while the person it belongs
          # to is on leave; the record of who they are stays with it.
          - name: on-leave
            fingerprints: ["SHA256:8kJq0pZ1rT4yWn6XsB2cVfL9dE3hGm5uA7iOxQ1zRyM"]
            policy: {deny: true}

          # Last, and naming no key: what everyone else gets.
          - name: staff
            policy:
              # A pattern over a command line is a weak policy: this one
              # would match "journalctl -u x; rm -rf /" as happily as
              # what it was written for. The gateway refuses a line
              # carrying a shell operator before any pattern is tried,
              # which is what makes the list mean what it looks like it
              # means. The strong form is force-command on the
              # certificate, where there is no line to match at all.
              allow_commands: ["^(uptime|df -h|journalctl .*)$"]

        # Where a port forward may go. Without this list direct-tcpip
        # is a tunnel to anything the target can reach.
        forward:
          - "10.20.0.0/16:5432"
          - "*.db.internal:*"
        remote_forward: false

        # What the session showed, in asciicast v2, one file per
        # channel: "xproxyctl session show FILE" reads it back. The
        # access log says a session happened; this says what was done in
        # it.
        #
        # Read it with that rather than with a player or with cat: the
        # file holds the bytes the session sent, a terminal is an
        # interpreter of exactly those, and a recorded session can set
        # the reviewer's clipboard or ask their terminal for a report it
        # answers on its own input.
        #
        # input is left off. A terminal's input stream carries what the
        # screen never showed, which includes every password typed into
        # a sudo prompt: recording output is watching over a shoulder,
        # recording input is a keylogger.
        recording:
          directory: /var/log/xproxy/sessions
          max_file_bytes: 33554432
          max_files: 2000

          # A hash-chained manifest beside each recording, keyed from
          # custody. Without this a recording is a file an administrator
          # can edit afterwards, and an incident report that rests on one
          # is a story. With a key the records cannot be rewritten by
          # somebody who has this host and not the key -- so keep the key
          # off this host, and verify somewhere this host is not:
          #
          #   xproxy-replay -verify -key env:XPROXY_CHAIN_KEY FILE
          #
          # It is a MAC, not a signature: whoever can read the key can
          # forge a record too. With a secrets.vault section the key is
          # better written as vault:secret/xproxy/recording#chain, which
          # never reaches this host's disk at all.
          integrity:
            key: env:XPROXY_CHAIN_KEY
            segment_bytes: 1048576

          # And the bytes on the disk are ciphertext. 0600 in a directory
          # protects these files from another user on this host and from
          # nothing else: not a backup that leaves the building, not a
          # stolen disk, not somebody who reaches the file system as the
          # proxy user. The recording of an administrative session is the
          # most valuable file on this machine.
          #
          # Read one with:
          #
          #   xproxy-replay -key env:XPROXY_REC_KEY FILE.cast.enc
          #   xproxyctl session show -key env:XPROXY_REC_KEY FILE.cast.enc
          #
          # A key that is lost is every recording it wrote lost, and
          # rotating it does not re-encrypt what is already written. Keep
          # every key for as long as its recordings are kept.
          encryption:
            key: env:XPROXY_REC_KEY
            chunk_bytes: 65536

        # The credential onwards, and the check that the target is the
        # target: the bastion is the one place that can notice a machine
        # in the middle.
        upstream_user: operator
        upstream_key_file: /etc/xproxy/ssh/bastion_id_ed25519
        upstream_known_hosts: /etc/xproxy/ssh/known_hosts

        proxy_protocol: false

    # A delivery account: sftp into one directory, read-only, and no
    # shell at all.
    - name: dropbox
      address: "0.0.0.0:2222"
      kind: ssh
      ssh:
        upstream: hosts
        host_keys: [/etc/xproxy/ssh/host_ed25519]
        authorized_keys: /etc/xproxy/ssh/dropbox_authorized_keys
        allow_channels: [session]
        allow_requests: [subsystem]
        allow_subsystems: [sftp]
        upstream_user: dropbox
        upstream_key_file: /etc/xproxy/ssh/bastion_id_ed25519
        upstream_known_hosts: /etc/xproxy/ssh/known_hosts
        # exec is not in allow_requests here, so nothing can run "scp
        # -t" past the section below. Were it allowed, the default of
        # allow_file_transfer_commands (false wherever there is an sftp
        # policy) would still refuse it.
        sftp:
          # Without this section the proxy can say only that the session
          # may use sftp, which is the difference between reading a file
          # and deleting a tree.
          read_only: true
          allow_paths:
            - "/srv/exports/**"
          deny_paths:
            - "/srv/exports/private/**"
          # Symbolic links are how a path policy is escaped from the
          # inside; readlink is refused with them.
          deny_operations: [symlink, readlink]
          max_packet_size: 262144

    # An upload account: each supplier writes into their own directory
    # and nowhere else, and what they write is read before it lands.
    - name: intake
      address: "0.0.0.0:2223"
      kind: ssh
      ssh:
        upstream: hosts
        host_keys: [/etc/xproxy/ssh/host_ed25519]
        authorized_keys: /etc/xproxy/ssh/intake_authorized_keys
        allow_channels: [session]
        allow_requests: [subsystem]
        allow_subsystems: [sftp]
        upstream_user: intake
        upstream_key_file: /etc/xproxy/ssh/bastion_id_ed25519
        upstream_known_hosts: /etc/xproxy/ssh/known_hosts
        sftp:
          # {user} is the login this session authenticated as. One rule
          # instead of one per supplier, and a login that could change
          # what the pattern means refuses the session rather than being
          # escaped into it.
          allow_paths:
            - "/srv/intake/{user}/**"
          deny_paths:
            - "/srv/intake/{user}/.ssh/**"
          # What a file is called. Every extension in the name is read,
          # so invoice.pdf.exe is an exe.
          allow_extensions: [csv, tsv, xml, pdf, gz]
          deny_extensions: [exe, dll, so, sh, php, js, jar]
          # One file, and the handles one session may hold.
          max_file_bytes: 1073741824
          max_open_files: 32
          # Read per file rather than per stream: two uploads on one
          # channel are two files.
          yara:
            rules_dir: /etc/xproxy/yara
            action: close

    # A bastion that is not there: a honeypot beside the real one, on a
    # port an estate plausibly runs SSH on and nothing here uses. 2222 is
    # the operators' second listener above, so this is 2022.
    #
    # What scans port 22 is a list of account names an estate actually
    # uses -- git, jenkins, postgres, deploy, ansible -- tried with a few
    # passwords each. Refusing collects the address the firewall log
    # already had; answering collects the list, and then what the session
    # came to do.
    - name: build-spare
      address: "0.0.0.0:2022"
      kind: ssh
      ssh:
        # A host key of its own, and never a real bastion's: a client
        # that pinned the real one would be told this is it.
        host_keys: [/etc/xproxy/ssh/decoy_host_ed25519]

        # No upstream, no authorized_keys, no users_file, no
        # trusted_user_ca_keys, no upstream_key_file and no
        # upstream_known_hosts: there is no machine behind this and
        # nobody real to let in. No mfa and no require_grant either --
        # the fabricated login accepts everybody by design, so a factor
        # in front of it would refuse the visitors it exists to collect.
        # Validation refuses all three rather than ignoring them.
        deception:
          mode: decoy

          # A server, which is what an SSH port fronts. `busybox` is the
          # other profile, and is the telnet trap's default.
          profile: linux

          # Name it after something this estate really has. A visitor who
          # finds "build-03" on a site whose build hosts are called
          # something else has found the fabrication.
          hostname: build-03

          # Two credentials taken before the login is accepted. Which one
          # it was makes no difference: a login that accepted the right
          # password and refused the wrong one would be a credential
          # oracle, which is the one thing a password list needs.
          #
          # A public key is recorded by fingerprint and then refused
          # whatever this is set to, so the client falls back to a
          # password -- which is what a trap on port 22 is for.
          attempts: 2

          # The escalation is already a tripwire and needs no listing:
          # wget, curl, chmod, nohup, crontab, systemctl, and the file
          # names a credential lives in. This is the one that means
          # something on this estate and nowhere else.
          tripwire: [payroll-export]

        # The transcript is the commands. The credential exchange is not
        # in it: it happened in the authentication, which had already
        # reduced it to a length and a handle.
        recording:
          directory: /var/log/xproxy/sessions
          input: true
          max_file_bytes: 8388608
          max_files: 2000
        idle_timeout: 5m
        session_timeout: 30m
        # The bound this listener has instead of max_connections: a script in
        # a loop is what finds a port like this.
        max_sessions: 200

upstreams:
  - name: hosts
    endpoints:
      - {address: "10.20.1.10:22"}
      - {address: "10.20.1.11:22"}
    balancer: least_conn
    timeouts: {connect: 5s}

bans:
  triggers:
    # Authentication failures and refused channels are both ssh_denied.
    - name: ssh-abuse
      reasons: [ssh_denied]
      threshold: 8
      window: 10m
      duration: 2h
    # A tripwire on a fabrication nothing is configured to use is about as
    # clear a signal as this estate produces, so it acts on the first. The
    # ordinary fabricated exchange is deliberately not named here: banning
    # it would end the collection.
    - name: ssh-decoy
      reasons: [ssh_tripwire]
      threshold: 1
      window: 1h
      duration: 24h

logging:
  access: {enabled: true}
