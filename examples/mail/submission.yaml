# A submission proxy in front of a mail server: RFC 6409 submission,
# RFC 3207 STARTTLS, RFC 1870 SIZE.
#
# A layer 4 splice would carry the same bytes. The difference is that
# here the proxy decides where every command and every message ends, and
# writes each one out again, so the client and the mail server cannot
# disagree about it. Every SMTP smuggling bug there has ever been lives
# in that disagreement.
#
# Validate: xproxy -config examples/mail/submission.yaml -validate
version: 1
server:
  listeners:
    # Submission on 587: plain on the wire until STARTTLS, and nothing
    # that matters is allowed before it.
    - name: submission
      address: "0.0.0.0:587"
      kind: smtp
      tls:
        certificates:
          - {cert_file: /etc/xproxy/certs/mail.pem, key_file: /etc/xproxy/certs/mail-key.pem}
        min_version: "1.2"
      smtp:
        upstream: mta

        # The proxy's own name. Without this the mail server's banner
        # goes out to every prober, version and all.
        banner: "mail.example.com ESMTP"
        hostname: mail.example.com

        tls_mode: starttls
        # No AUTH, MAIL or VRFY until the session is encrypted. This is
        # the difference between offering TLS and requiring it.
        require_tls: true
        # A submission listener relays for its users and for nobody
        # else.
        require_auth: true

        # One connection is not a fan-out.
        max_recipients: 50
        max_messages: 20
        max_message_size: 26214400   # 25 MiB, advertised as SIZE
        max_errors: 5
        max_connections: 2000

        # RFC 5321 line bounds. A line over them is refused rather than
        # split, because the split is where two parsers disagree.
        max_command_line: 512
        max_text_line: 1000

        # A line ended by LF alone is forbidden and is the smuggling
        # vector; reject refuses the session, convert repairs the line
        # instead. Repair is safe here only because the proxy re-emits
        # every line itself.
        bare_newlines: reject

        read_timeout: 5m
        session_timeout: 30m

        # The hop to the mail server gets its own TLS, verified.
        upstream_tls_mode: starttls
        upstream_tls:
          server_name: mta.internal
          ca_file: /etc/xproxy/certs/internal-ca.pem
          min_version: "1.3"

        # Tell the mail server who the client really is, so its own
        # logs and policies are not all about the proxy.
        xclient: true

    # Implicit TLS on 465 (RFC 8314): encrypted from the first octet,
    # so there is no plaintext phase to downgrade.
    - name: submissions
      address: "0.0.0.0:465"
      kind: smtp
      tls:
        certificates:
          - {cert_file: /etc/xproxy/certs/mail.pem, key_file: /etc/xproxy/certs/mail-key.pem}
        min_version: "1.2"
      smtp:
        upstream: mta
        banner: "mail.example.com ESMTP"
        hostname: mail.example.com
        tls_mode: implicit
        require_auth: true
        # STARTTLS makes no sense once the session is already encrypted,
        # and a listener that still offers it invites a downgrade.
        commands: [EHLO, HELO, MAIL, RCPT, DATA, RSET, NOOP, QUIT, AUTH]
        max_message_size: 26214400
        upstream_tls_mode: starttls
        upstream_tls: {server_name: mta.internal, ca_file: /etc/xproxy/certs/internal-ca.pem}
        xclient: true

upstreams:
  - name: mta
    endpoints:
      - {address: "10.0.0.20:587"}
      - {address: "10.0.0.21:587"}
    balancer: least_conn
    timeouts: {connect: 5s}

bans:
  # A client that pipelines across STARTTLS, sends a bare newline in a
  # message, or walks the command space is not a mail client.
  triggers:
    - name: smtp-abuse
      reasons: [smtp_denied]
      threshold: 3
      window: 10m
      duration: 1h

logging:
  access: {enabled: true}
