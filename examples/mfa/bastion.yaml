# One second factor, two protocols: the bastion's half.
#
# TOTP (RFC 6238 over the HMAC-OTP of RFC 4226) against one enrolment
# file, used here by the SSH bastion and, in web.yaml beside this file,
# by a web application. It is one file and one set of rules on purpose:
# a second factor that means different things on different ports is not
# a second factor, because the weakest door decides.
#
# The two halves are two files because they are two daemons: the bastion
# is xgate's and the web listener is xproxy's. What they share is the
# enrolment file on disk, which is the thing that had to be shared.
#
# Enrol a user with:
#   xproxyctl mfa enrol -user alice -issuer example.com -recovery 5
# and add the printed line to /etc/xproxy/mfa (0600), readable by both
# daemons.
#
# Validate: xgate -config examples/mfa/bastion.yaml -validate
version: 1
server:
  listeners:
    # SSH: the key is the first factor, the code is the second. The
    # client is told authentication partially succeeded and is then
    # asked for a code; a key alone opens no channel.
    - name: bastion
      address: "0.0.0.0:22"
      kind: ssh
      ssh:
        upstream: hosts
        host_keys: [/etc/xproxy/ssh/host_ed25519]
        authorized_keys: /etc/xproxy/ssh/authorized_keys
        upstream_user: operator
        upstream_key_file: /etc/xproxy/ssh/bastion_id_ed25519
        upstream_known_hosts: /etc/xproxy/ssh/known_hosts
        mfa:
          file: /etc/xproxy/mfa
          issuer: example.com
          prompt: "One-time code: "
          # Each step accepted either side of now is a window an
          # observed code can be replayed in. One step is the usual
          # allowance for a clock that drifts.
          skew: 1
          require_enrolment: true
          max_failures: 5
          window: 5m
          lockout: 15m

upstreams:
  - name: hosts
    endpoints: [{address: "10.20.1.10:22"}]

bans:
  triggers:
    # Failed codes are ssh_denied. The web half counts its own refusals
    # but does not ban on them, because a person mistyping a code on a
    # form is the common case and the lockout already bounds the
    # guessing.
    - name: mfa-guessing
      reasons: [ssh_denied]
      threshold: 10
      window: 10m
      duration: 1h

logging:
  access: {enabled: true}
