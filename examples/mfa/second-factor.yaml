# One second factor, two protocols.
#
# TOTP (RFC 6238 over the HMAC-OTP of RFC 4226) against one enrolment
# file, used by an SSH bastion and by a web application behind the same
# proxy. It is one file and one set of rules on purpose: a second factor
# that means different things on different ports is not a second factor,
# because the weakest door decides.
#
# Enrol a user with:
#   xproxyctl mfa enrol -user alice -issuer example.com -recovery 5
# and add the printed line to /etc/xproxy/mfa (0600).
#
# Validate: xproxy -config examples/mfa/second-factor.yaml -validate
version: 1
server:
  listeners:
    # SSH: the key is the first factor, the code is the second. The
    # client is told authentication partially succeeded and is then
    # asked for a code; a key alone opens no channel.
    - name: bastion
      address: "0.0.0.0:22"
      kind: ssh
      ssh:
        upstream: hosts
        host_keys: [/etc/xproxy/ssh/host_ed25519]
        authorized_keys: /etc/xproxy/ssh/authorized_keys
        upstream_user: operator
        upstream_key_file: /etc/xproxy/ssh/bastion_id_ed25519
        upstream_known_hosts: /etc/xproxy/ssh/known_hosts
        mfa:
          file: /etc/xproxy/mfa
          issuer: example.com
          prompt: "One-time code: "
          # Each step accepted either side of now is a window an
          # observed code can be replayed in. One step is the usual
          # allowance for a clock that drifts.
          skew: 1
          require_enrolment: true
          max_failures: 5
          window: 5m
          lockout: 15m

    # HTTPS: the password is the first factor and the same code is the
    # second. The filter order is the whole design — mfa challenges the
    # identity that basic-auth established, and refuses a request that
    # has none.
    - name: web
      address: "0.0.0.0:443"
      kind: http
      tls:
        certificates:
          - {cert_file: /etc/xproxy/certs/app.pem, key_file: /etc/xproxy/certs/app-key.pem}

filters:
  - name: staff
    kind: basic_auth
    options:
      users_file: /etc/xproxy/staff.htpasswd
      realm: staff
      forward_user_header: X-Remote-User

  - name: staff-mfa
    kind: mfa
    options:
      file: /etc/xproxy/mfa
      cookie_secret_file: /etc/xproxy/mfa.cookie
      issuer: example.com
      # How long a verified factor lasts before the code is asked for
      # again. A working day is the usual answer; a shorter one for
      # anything that administers the estate.
      ttl: 12h
      skew: 1
      require_enrolment: true
      identity: [basic]

routes:
  - name: app
    paths: [/]
    upstream: app
    # Order matters: the identity has to exist before there is anything
    # to ask for a second factor for.
    filters: [staff, staff-mfa]

  - name: admin
    paths: [/admin/]
    upstream: app
    filters: [staff, staff-mfa]

upstreams:
  - name: app
    endpoints: [{address: "10.0.0.40:8080"}]
  - name: hosts
    endpoints: [{address: "10.20.1.10:22"}]

bans:
  triggers:
    # Failed codes are ssh_denied on the bastion; the filter's own
    # refusals are counted but not banned, because a person mistyping a
    # code on a web form is the common case and the lockout already
    # bounds the guessing.
    - name: mfa-guessing
      reasons: [ssh_denied]
      threshold: 10
      window: 10m
      duration: 1h

logging:
  access: {enabled: true}
