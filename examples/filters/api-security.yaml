# API security filters: managed API keys, OpenAPI validation and GraphQL
# bounds. Validate with
#   xproxy -config examples/filters/api-security.yaml -validate
# (the keys file and the description must exist; see README.md).
version: 1
server:
  listeners:
    - {name: http, address: ":8080"}
filters:
  - name: keys
    kind: api_key
    options:
      keys_file: /etc/xproxy/api-keys          # xproxyctl apikey add acme -scopes orders:read
      required_scopes: [orders:read]
      forward_id_header: X-Api-Key-Id
  - name: orders-spec
    kind: openapi
    options:
      spec_file: /etc/xproxy/openapi/orders.yaml   # examples/filters/orders-openapi.yaml
      strict_query: true
      max_body_bytes: 262144
  - name: gql
    kind: graphql
    options:
      max_depth: 8
      max_complexity: 500
      max_aliases: 10
      max_batch: 1
      introspection: false
  # gRPC calls are length-prefixed protobuf inside the body. Routing
  # them by path reads the envelope; this reads the messages, which is
  # where a bound on one message, on how deeply it nests and on how
  # many fields it carries actually lives.
  #
  # No schema: one would have to be kept in step with the service, and
  # a check that is only as current as its schema is a check that
  # quietly stops applying the week somebody adds a field.
  - name: rpc
    kind: grpc_guard
    options:
      max_message_bytes: 4194304   # what grpc-go defaults to, so what the backend lives with
      max_messages: 100            # a streaming call is still a bounded one
      max_depth: 12
      max_fields: 2000
      # Refuse what this cannot read, because the patterns below cannot
      # run over bytes nobody decompressed.
      allow_compressed: false
      deny_patterns:
        - "(?i)-----BEGIN (RSA |EC )?PRIVATE KEY-----"
rate_limits:
  - {name: per-key, key: "header:X-Api-Key", algorithm: sliding_window, limit: 600, window: 1m}
upstreams:
  - {name: orders, endpoints: [{address: "10.0.1.10:8080"}]}
  - {name: gateway, endpoints: [{address: "10.0.2.10:8080"}]}
routes:
  - name: orders
    paths: [/v1/orders]
    upstream: orders
    rate_limits: [per-key]
    filters: [keys, orders-spec]
  - name: graphql
    paths: [/graphql]
    upstream: gateway
    rate_limits: [per-key]
    filters: [keys, gql]
  - name: rpc
    paths: [/pkg.Orders/]
    upstream: orders
    grpc: {services: ["pkg.Orders"]}
    filters: [rpc]
