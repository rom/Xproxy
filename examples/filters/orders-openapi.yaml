openapi: 3.0.3
info: {title: Orders, version: "1.0"}
servers: [{url: https://api.example.com/v1}]
# Where the credential lives, and which operations need it.
# require_security reads this and refuses a request that carries none,
# which catches the endpoint somebody forgot to protect.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    Item:
      type: object
      required: [sku, qty]
      additionalProperties: false
      properties:
        sku: {type: string, pattern: "^[A-Z]{3}-[0-9]{4}$"}
        qty: {type: integer, minimum: 1, maximum: 100}
    Order:
      type: object
      required: [customer, items]
      properties:
        # The server owns these two, so a client must not send them.
        # read_only in the filter decides whether that is refused,
        # logged or allowed.
        id: {type: string, format: uuid, readOnly: true}
        createdAt: {type: string, format: date-time, readOnly: true}
        customer: {type: string, format: email}
        items: {type: array, minItems: 1, maxItems: 50, items: {$ref: "#/components/schemas/Item"}}
        priority: {type: string, enum: [low, normal, high]}
paths:
  /orders:
    get:
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: status, in: query, schema: {type: string, enum: [open, shipped, closed]}}
    post:
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: "#/components/schemas/Order"}}
  /orders/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get: {}
    delete: {}
  /health:
    # An operation that needs nothing: an explicit empty list, which is
    # different from saying nothing at all.
    get:
      security: []
