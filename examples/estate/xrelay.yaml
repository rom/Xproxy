# The relay daemon of the same estate: the protocols machines speak.
#
# Validate: xrelay -config examples/estate/xrelay.yaml -validate
version: 1
includes: [/etc/xproxy/estate.d/*.yaml]

server:
  listeners:
    - name: submission
      address: "0.0.0.0:587"
      kind: smtp
      tls:
        certificates:
          - {cert_file: /etc/xproxy/certs/mail.pem, key_file: /etc/xproxy/certs/mail-key.pem}
      smtp:
        upstream: mail
        tls_mode: starttls
        require_tls: true
    - name: telemetry
      address: "0.0.0.0:1883"
      kind: mqtt
      mqtt:
        upstream: broker

management:
  socket: /run/xrelay/mgmt.sock
  socket_mode: "0660"
  history_dir: /var/lib/xrelay/history
metrics:
  listen: "127.0.0.1:9102"
logging:
  directory: /var/log/xrelay
  access: {enabled: true}

cluster:
  node_id: xrelay
  listen: unix:/run/xproxy-cluster/xrelay.sock
  peers:
    - unix:/run/xproxy-cluster/xproxy.sock
    - unix:/run/xproxy-cluster/xgate.sock
    - unix:/run/xproxy-cluster/xot.sock
  local:
    socket_mode: "0660"
    allow_uids: [990, 991, 992, 993]
  share_rate_limits: false
  share_bans: true
  share_events: true

upstreams:
  - name: mail
    endpoints: [{address: "10.20.2.25:25"}]
  - name: broker
    endpoints: [{address: "10.20.3.83:1883"}]
