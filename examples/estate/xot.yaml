# The OT daemon of the same estate: the protocols the plant speaks.
#
# It is a fourth process on the same machine here so that the whole
# estate reads as one set of files, but the point of the daemon is the
# deployment where it is alone on a box at level 3.5: no mail parser, no
# FTP, no directory and no database wire protocol on the host that faces
# the process network.
#
# Validate: xot -config examples/estate/xot.yaml -validate
version: 1
includes: [/etc/xproxy/estate.d/*.yaml]

server:
  listeners:
    # The control protocol. Positive policy, default deny: on this
    # network what is not written down is refused.
    - name: line
      address: "0.0.0.0:502"
      kind: modbus
      modbus:
        upstream: plc
        allow_clients: ["10.20.7.0/24"]
        log_frames: true
        default_action: deny
        rules:
          - {name: historian-reads, action: allow, clients: ["10.20.7.20/32"], functions: [read_holding_registers, read_input_registers]}

    # A kind both relays serve, named for this one: the plant's own
    # telemetry, so the device births the inventory reads arrive in the
    # same daemon as the Modbus traffic rather than in a second one.
    - name: telemetry
      address: "0.0.0.0:1883"
      kind: mqtt
      daemon: xot
      mqtt:
        upstream: broker

asset_inventory:
  enabled: true
  state_file: /var/lib/xot/inventory.json

management:
  socket: /run/xot/mgmt.sock
  socket_mode: "0660"
  history_dir: /var/lib/xot/history
metrics:
  listen: "127.0.0.1:9103"
logging:
  directory: /var/log/xot
  access: {enabled: true}

cluster:
  node_id: xot
  listen: unix:/run/xproxy-cluster/xot.sock
  peers:
    - unix:/run/xproxy-cluster/xproxy.sock
    - unix:/run/xproxy-cluster/xgate.sock
    - unix:/run/xproxy-cluster/xrelay.sock
  local:
    socket_mode: "0660"
    allow_uids: [990, 991, 992, 993]
  share_rate_limits: false
  share_bans: true
  share_events: true

upstreams:
  - name: plc
    endpoints: [{address: "10.40.1.10:502"}]
  - name: broker
    endpoints: [{address: "10.20.3.83:1883"}]
