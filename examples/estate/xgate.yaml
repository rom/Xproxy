# The gate daemon of the same estate: the SSH bastion.
#
# It reads the same estate.d/ fragments as its siblings, so the
# upstreams and the ban policy are written once, and it has its own
# socket, metrics port, log directory and user.
#
# Validate: xgate -config examples/estate/xgate.yaml -validate
version: 1
includes: [/etc/xproxy/estate.d/*.yaml]

server:
  listeners:
    - name: bastion
      address: "0.0.0.0:22"
      kind: ssh
      ssh:
        upstream: hosts
        host_keys: [/etc/xproxy/ssh/host_ed25519]
        authorized_keys: /etc/xproxy/ssh/authorized_keys
        upstream_user: operator
        upstream_key_file: /etc/xproxy/ssh/bastion_id_ed25519
        upstream_known_hosts: /etc/xproxy/ssh/known_hosts
        recording:
          directory: /var/lib/xgate/sessions

management:
  socket: /run/xgate/mgmt.sock
  socket_mode: "0660"
  history_dir: /var/lib/xgate/history
metrics:
  listen: "127.0.0.1:9101"
logging:
  directory: /var/log/xgate
  access: {enabled: true}

cluster:
  node_id: xgate
  listen: unix:/run/xproxy-cluster/xgate.sock
  peers:
    - unix:/run/xproxy-cluster/xproxy.sock
    - unix:/run/xproxy-cluster/xrelay.sock
  local:
    socket_mode: "0660"
    allow_uids: [990, 991, 992]
  share_rate_limits: false
  share_bans: true
  share_events: true

upstreams:
  - name: hosts
    endpoints: [{address: "10.20.1.10:22"}]
