# The edge daemon of a three daemon estate on one machine.
#
# xproxy, xgate and xrelay run side by side as three users, each with
# its own management socket, metrics address and log directory, and each
# reading a file of its own. What they share -- the upstreams, the
# routes, the ban policy -- is in estate.d/ and included by all three.
#
# They also share a ban list, over the Unix socket cluster below. An
# address the bastion refuses at the SSH port is refused at the edge
# too, in about a gossip interval, and no certificate is involved: the
# peers are processes this kernel can name.
#
# Validate: xproxy -config examples/estate/xproxy.yaml -validate
version: 1
includes: [/etc/xproxy/estate.d/*.yaml]

server:
  listeners:
    - name: public-http
      address: "0.0.0.0:80"
      redirect_to_https: true
    - name: public
      address: "0.0.0.0:443"
      tls:
        certificates:
          - {cert_file: /etc/xproxy/certs/site.pem, key_file: /etc/xproxy/certs/site-key.pem}
    # A resolver is the edge's too: it faces whatever asks it a
    # question, which is the same trust as the web listeners.
    - name: resolver
      address: "127.0.0.1:53"
      kind: dns
      dns:
        upstreams: ["tls://1.1.1.1:853"]
        allow_clients: [10.0.0.0/8]

# The three sections that name something only one process can own.
management:
  socket: /run/xproxy/mgmt.sock
  socket_mode: "0660"
  history_dir: /var/lib/xproxy/history
metrics:
  listen: "127.0.0.1:9100"
logging:
  directory: /var/log/xproxy
  access: {enabled: true}

cluster:
  node_id: xproxy
  listen: unix:/run/xproxy-cluster/xproxy.sock
  peers:
    - unix:/run/xproxy-cluster/xgate.sock
    - unix:/run/xproxy-cluster/xrelay.sock
    - unix:/run/xproxy-cluster/xot.sock
  local:
    # The shared directory is 0770 root:xproxy-cluster and the
    # daemons are in that group, so the socket's mode is already the
    # boundary. The user ids say it a second time, from the connection
    # rather than from the file system.
    socket_mode: "0660"
    allow_uids: [990, 991, 992, 993]
  # Bans are the point of a local cluster. Rate limits are per daemon
  # anyway -- they serve different protocols on different ports -- and
  # sharing them would only add noise.
  share_rate_limits: false
  share_bans: true
  share_events: true
