# Honeytokens: credentials that exist only to be stolen.
#
# The decoys this proxy serves hand out an AWS key, a database
# password, a connection string, a private key block. Until something
# watches for their use, the bait has no hook: a scanner reads the
# file and all the proxy knows is that the file was read.
#
# Registering the planted values here closes that. Nothing legitimate
# ever sends one, so there is no score to tune and no false-positive
# rate to trade away: a request presenting one is an attacker replaying
# what they read. One hit is worth an alert on its own.
#
# Plant them widely — in the decoys below, in a repository, a paste, a
# backup, a document, a staging database — and name each plant so the
# alert says which one was found.
#
# Validate: xproxy -config examples/security/honeytokens.yaml -validate
# Inspect:  xproxyctl honeypot
version: 1
server:
  listeners:
    - {name: main, address: "0.0.0.0:8080"}
logging:
  access: {enabled: true}
  security: {enabled: true}
trusted_proxies: ["10.0.0.0/8"]

bans:
  action: reject
  state_file: /var/lib/xproxy/bans.db
  triggers:
    # One use of a planted credential is enough. There is no threshold
    # to argue about: nobody sends one by accident.
    - name: honeytoken-use
      reasons: [honeytoken]
      threshold: 1
      window: 1m
      duration: 24h
      escalation: 2
      max_duration: 720h

# The last layer: a client the ban list already holds does not get a
# TLS handshake at all. The refusal costs one hello and tells the
# scanner nothing — but it never becomes a request, so it is in the
# security log and the metrics rather than the access log.
handshake:
  refuse_banned: true

honeytokens:
  # The values the built-in decoys serve. An attacker who read
  # /.env or /.aws/credentials through a honeypot route and then tried
  # the key comes back here.
  - name: env-aws-key
    description: planted in the env and aws-credentials decoys
    values:
      - "AKIADECOY000000EXAMPLE"
      - "decoy/secret/not/real/0000000000000000"

  - name: env-db-password
    description: planted in the env decoy
    values: ["decoy-Passw0rd"]
    # A password is presented as a password: in the authorization
    # header, or as a form or query value.
    in: [headers, query]

  - name: web-config-connection
    description: planted in the web-config decoy
    values: ["decoy-Passw0rd-not-real"]

  # A session cookie seeded into a database export that should never
  # have left the estate. Its use says the export did.
  - name: backup-session
    description: seeded in the 2026-01 customer database export
    values: ["s%3Adecoy.0000000000000000000000000000"]
    in: [cookies]

  # An API key committed to a repository on purpose, so a scrape of
  # that repository is visible the moment it is used.
  - name: public-repo-key
    description: committed to the example/public-web repository
    values: ["xpk_decoy_0000000000000000000000000000"]
    in: [headers, query]
    headers: [authorization, x-api-key, api-key]

  # An identifier embedded in a document rather than a credential: the
  # client echoes the whole document back, so the token is matched
  # anywhere inside a value.
  - name: leaked-report-id
    description: embedded in the quarterly report PDF
    values: ["decoy-report-id-0123456789abcdef"]
    match: contains
    in: [headers, query]

  # A URL nobody was given. A request for it is someone who read a
  # backup, a log or a ticket they should not have.
  - name: unlinked-export-url
    description: printed in the internal runbook only
    values: ["export-7f3a9c2b1d8e4056"]
    in: [path]

  # Values generated by something else, one per line. Start a new
  # plant in log mode until it is proven quiet, then switch it to
  # block: a token that fires on real traffic was planted badly.
  - name: seeded-staging-keys
    description: seeded into the staging database
    values_file: /etc/xproxy/honeytokens/staging-keys
    action: log

# The honeypot routes that serve the decoys the tokens above are
# planted in. The pairing is the point: the decoy is the bait, the
# token is the hook.
upstreams:
  - name: app
    endpoints: [{address: "10.0.0.10:8080"}]

routes:
  - name: hp-dotenv
    paths: [/.env, /.env.local, /.env.production]
    honeypot: {decoy: env, mark: 24h, delay: 2s}
  - name: hp-aws
    paths: [/.aws/credentials, /.aws/config]
    honeypot: {decoy: aws-credentials, mark: 24h, delay: 3s}
  - name: hp-web-config
    paths: [/web.config, /web.config.bak]
    honeypot: {decoy: web-config, mark: 24h, delay: 3s}
  - name: app
    paths: [/]
    upstream: app
