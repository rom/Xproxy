# Honeypot routes: the paths nobody legitimate asks for.
#
# A request for /.env or /wp-login.php on an API host is not a mistake.
# Each route below answers with a decoy that looks like the thing the
# scanner wanted, marks the client for an hour, and lets the ban ladder
# turn a sweep into a ban. The decoys contain nothing an operator would
# mind being read: every credential, key and host name in them is
# visibly fake.
#
# Three things make this worth running rather than just interesting:
#
#   * `mark` labels the client's later requests on every other route
#     (`honeypot_marked` in the access log, `Info.HoneypotMarked` for
#     filters, a `bot_score` signal), so one touch here follows the
#     client across the site.
#   * `delay` holds the connection in a tarpit slot, which costs the
#     scanner more than it costs this proxy: a tarpitted request gives
#     up its concurrency slot first.
#   * `bans.triggers` below turns a sweep of several decoys into a ban,
#     while one stray request from a search engine does nothing.
#
# Serve this on a host that has no business being scanned. Do not put a
# honeypot path in front of a real application's namespace: if the
# origin serves /admin, do not shadow it here.
#
# Validate: xproxy -config examples/security/honeypots.yaml -validate
# Inspect:  xproxyctl honeypot
version: 1
server:
  listeners:
    - {name: main, address: "0.0.0.0:8080"}
logging:
  access: {enabled: true}
  security: {enabled: true}

bans:
  action: reject
  state_file: /var/lib/xproxy/bans.db
  triggers:
    # Two decoys inside a minute is a sweep, not a typo. The ladder
    # doubles to a day: a scanner that comes back finds a longer wall.
    - name: honeypot-sweep
      reasons: [honeypot]
      threshold: 2
      window: 1m
      duration: 1h
      escalation: 2
      max_duration: 24h

upstreams:
  - name: app
    endpoints: [{address: "10.0.0.10:8080"}]

routes:
  # ---- PHP and WordPress -------------------------------------------
  - name: hp-wp-login
    paths: [/wp-login.php, /wp-admin, /xmlrpc.php]
    honeypot: {decoy: wp-login, mark: 1h, delay: 2s}
  - name: hp-wp-config
    paths: [/wp-config.php, /wp-config.php.bak, /wp-config.php.save, /wp-config.txt]
    honeypot: {decoy: wp-config, mark: 1h, delay: 2s}
  - name: hp-phpmyadmin
    paths: [/phpmyadmin, /pma, /PMA, /mysql, /dbadmin]
    honeypot: {decoy: phpmyadmin, mark: 1h, delay: 2s}
  - name: hp-phpinfo
    paths: [/phpinfo.php, /info.php, /test.php, /i.php]
    honeypot: {decoy: phpinfo, mark: 1h}

  # ---- Leaked files -------------------------------------------------
  - name: hp-dotenv
    paths: [/.env, /.env.local, /.env.production, /.env.bak, /api/.env]
    honeypot: {decoy: env, mark: 1h, delay: 2s}
  - name: hp-git
    paths: [/.git/config, /.git/HEAD, /.gitconfig]
    honeypot: {decoy: git-config, mark: 1h}
  - name: hp-aws
    paths: [/.aws/credentials, /.aws/config]
    honeypot: {decoy: aws-credentials, mark: 6h, delay: 2s}
  - name: hp-ssh
    paths: [/.ssh/id_rsa, /.ssh/id_ed25519, /id_rsa]
    honeypot: {decoy: ssh-key, mark: 6h, delay: 2s}
  - name: hp-kube
    paths: [/.kube/config]
    honeypot: {decoy: kubeconfig, mark: 6h, delay: 2s}
  - name: hp-compose
    paths: [/docker-compose.yml, /docker-compose.yaml, /Dockerfile]
    honeypot: {decoy: docker-compose, mark: 1h}
  - name: hp-htpasswd
    paths: [/.htpasswd, /.htaccess]
    honeypot: {decoy: htpasswd, mark: 1h}
  - name: hp-backup
    paths: [/backup.sql, /dump.sql, /database.sql, /db.sql, /backup.sql.gz]
    honeypot: {decoy: backup-sql, mark: 6h, delay: 3s}
  - name: hp-buckets
    paths: [/backups/, /backup/, /uploads/backup/]
    honeypot: {decoy: s3-listing, mark: 1h}

  # ---- Management interfaces ---------------------------------------
  - name: hp-admin
    paths: [/admin, /administrator, /admin.php, /admin/login]
    honeypot: {decoy: admin-login, mark: 1h, delay: 2s}
  - name: hp-tomcat
    paths: [/manager/html, /manager/status, /host-manager/html]
    honeypot: {decoy: tomcat-manager, mark: 1h, delay: 2s}
  - name: hp-jenkins
    paths: [/jenkins, /jenkins/login, /script]
    honeypot: {decoy: jenkins, mark: 1h}
  - name: hp-grafana
    paths: [/grafana, /grafana/login]
    honeypot: {decoy: grafana, mark: 1h}
  - name: hp-idrac
    paths: [/idrac, /ipmi, /redfish/v1]
    honeypot: {decoy: idrac, mark: 6h, delay: 3s}
  - name: hp-webmail
    paths: [/webmail, /roundcube, /owa, /mail]
    honeypot: {decoy: webmail, mark: 1h}

  # ---- Application internals ---------------------------------------
  - name: hp-actuator
    paths: [/actuator, /actuator/env, /actuator/heapdump]
    honeypot: {decoy: actuator, mark: 6h, delay: 2s}
  - name: hp-elastic
    paths: [/_cluster/health, /_cat/indices, /_search]
    honeypot: {decoy: elasticsearch, mark: 1h}
  - name: hp-swagger
    paths: [/swagger.json, /swagger-ui.html, /v2/api-docs, /openapi.json]
    honeypot: {decoy: swagger, mark: 1h}
  - name: hp-debug
    paths: [/debug/vars, /debug/pprof]
    honeypot: {decoy: debug-vars, mark: 1h}
  - name: hp-status
    paths: [/server-status, /server-info, /nginx_status, /status]
    honeypot: {decoy: server-status, mark: 1h}

  # ---- Developer leftovers ------------------------------------------
  # The files a laptop or a build agent leaves in a deployment. A
  # request for one of them is never a browser: nothing links to them.
  - name: hp-npmrc
    paths: [/.npmrc, /.yarnrc, /.yarnrc.yml]
    honeypot: {decoy: npmrc, mark: 6h, delay: 2s}
  - name: hp-pypirc
    paths: [/.pypirc, /.netrc, /.pip/pip.conf]
    honeypot: {decoy: pypirc, mark: 6h, delay: 2s}
  - name: hp-gitlab-ci
    paths: [/.gitlab-ci.yml, /.travis.yml, /.circleci/config.yml, /bitbucket-pipelines.yml]
    honeypot: {decoy: gitlab-ci, mark: 1h}
  - name: hp-terraform
    paths: [/terraform.tfstate, /terraform.tfstate.backup, /.terraform/terraform.tfstate]
    honeypot: {decoy: terraform-state, mark: 6h, delay: 3s}
  - name: hp-sftp-json
    paths: [/.vscode/sftp.json, /sftp-config.json, /.ftpconfig]
    honeypot: {decoy: vscode-sftp, mark: 6h, delay: 2s}
  - name: hp-appsettings
    paths: [/appsettings.json, /appsettings.Production.json, /web.config]
    honeypot: {decoy: appsettings, mark: 6h, delay: 2s}
  - name: hp-rails
    paths: [/config/database.yml, /config/secrets.yml, /config/master.key]
    honeypot: {decoy: database-yml, mark: 6h, delay: 2s}
  - name: hp-nginx-conf
    paths: [/nginx.conf, /etc/nginx/nginx.conf, /conf/nginx.conf]
    honeypot: {decoy: nginx-config, mark: 1h}

  # ---- Metadata and orchestration APIs ------------------------------
  # These paths are server side request forgery probes: the client is
  # asking this proxy to fetch its own credentials. Mark hard.
  - name: hp-imds
    paths:
      - /latest/meta-data
      - /latest/meta-data/iam/security-credentials
      - /computeMetadata/v1
      - /metadata/instance
    honeypot: {decoy: imds, mark: 24h, delay: 5s}
  - name: hp-consul
    paths: [/v1/catalog/services, /v1/agent/self, /v1/kv]
    honeypot: {decoy: consul, mark: 6h, delay: 2s}
  - name: hp-vault
    paths: [/v1/sys/seal-status, /v1/sys/health, /v1/secret]
    honeypot: {decoy: vault, mark: 6h, delay: 2s}
  - name: hp-docker-api
    paths: [/containers/json, /v1.41/containers/json, /images/json, /info]
    honeypot: {decoy: docker-api, mark: 24h, delay: 5s}
  - name: hp-kubelet
    paths: [/pods, /runningpods, /metrics/cadvisor]
    honeypot: {decoy: kubelet, mark: 24h, delay: 5s}

  # ---- Data stores and dashboards -----------------------------------
  - name: hp-couchdb
    paths: [/_all_dbs, /_utils, /_membership]
    honeypot: {decoy: couchdb, mark: 6h}
  - name: hp-solr
    paths: [/solr, /solr/admin/cores, /solr/admin/info/system]
    honeypot: {decoy: solr, mark: 6h}
  - name: hp-rabbitmq
    paths: [/api/overview, /rabbitmq, /api/vhosts]
    honeypot: {decoy: rabbitmq, mark: 6h}
  - name: hp-kibana
    paths: [/app/kibana, /kibana, /app/home]
    honeypot: {decoy: kibana, mark: 1h}
  - name: hp-prometheus
    paths: [/api/v1/status/config, /api/v1/targets, /prometheus]
    honeypot: {decoy: prometheus-config, mark: 6h, delay: 2s}
  - name: hp-traefik
    paths: [/api/rawdata, /api/http/routers, /dashboard/]
    honeypot: {decoy: traefik, mark: 6h}

  # ---- Enterprise front doors ---------------------------------------
  # The login pages a mass scanner fingerprints before it picks an
  # exploit. Answering costs the scanner a round trip and tells this
  # proxy exactly which product it came shopping for.
  - name: hp-confluence
    paths: [/login.action, /confluence, /wiki/login.action, /pages/doenterpagevariables.action]
    honeypot: {decoy: confluence, mark: 6h, delay: 2s}
  - name: hp-gitlab
    paths: [/users/sign_in, /gitlab, /explore]
    honeypot: {decoy: gitlab-login, mark: 1h}
  - name: hp-citrix
    paths: [/vpn/index.html, /cgi/login, /citrix, /logon/LogonPoint/index.html]
    honeypot: {decoy: citrix, mark: 24h, delay: 3s}
  - name: hp-fortinet
    paths: [/remote/login, /remote/fgt_lang, /sslvpn]
    honeypot: {decoy: fortinet, mark: 24h, delay: 3s}
  - name: hp-esxi
    paths: [/ui/, /sdk, /folder]
    honeypot: {decoy: esxi, mark: 24h, delay: 3s}
  - name: hp-exchange
    paths: [/autodiscover/autodiscover.xml, /ecp/, /powershell]
    honeypot: {decoy: exchange-autodiscover, mark: 24h, delay: 3s}
  - name: hp-cgi
    paths: [/cgi-bin/mainfunction.cgi, /cgi-bin/luci, /cgi-bin/test.cgi, /boaform/admin/formLogin]
    honeypot: {decoy: cgi-bin, mark: 24h, delay: 5s}

  # ---- Application internals ----------------------------------------
  - name: hp-wp-users
    paths: [/wp-json/wp/v2/users, /wp-json/wp/v2/pages, /author/]
    honeypot: {decoy: wp-users, mark: 1h}
  - name: hp-graphql
    paths: [/graphql, /graphiql, /v1/graphql, /api/graphql]
    honeypot: {decoy: graphql, mark: 1h, delay: 2s}
  - name: hp-laravel-log
    paths: [/storage/logs/laravel.log, /logs/laravel.log, /log/production.log]
    honeypot: {decoy: laravel-log, mark: 6h, delay: 2s}
  - name: hp-adminer
    paths: [/adminer, /adminer.php, /adm.php, /db.php]
    honeypot: {decoy: adminer, mark: 1h, delay: 2s}

  # ---- Shells somebody else supposedly left -------------------------
  # A request for one of these is a scanner looking for another
  # attacker's work. Six hours and a long tarpit.
  - name: hp-webshell
    paths: [/shell.php, /cmd.php, /up.php, /alfa.php, /wso.php, /c99.php, /upload.php]
    honeypot: {decoy: webshell, mark: 6h, delay: 5s}

  # ---- The map ------------------------------------------------------
  # Served honestly: it names the paths above, so a crawler that reads
  # it and then asks for them has told you what it is.
  - name: hp-robots
    paths: [/robots.txt]
    honeypot: {decoy: robots, mark: 0s}

  # The real application, last: every path above is more specific.
  - name: app
    paths: [/]
    upstream: app
