# Example custom rules, usable with or without the Core Rule Set.
#
# Load with:
#   waf:
#     profiles:
#       - name: default
#         crs: {paranoia_level: 1}
#         directive_files:
#           - /etc/xproxy/waf/exclusions.conf
#           - /etc/xproxy/waf/custom-rules.conf
#
# Every rule has an id below 100,000, a phase, a message and a tag, so
# that per rule statistics (xproxyctl waf rules) and the security log
# name them. Rules that deny use status 403 unless another code fits.

# Block a debugging header that must never arrive from the internet.
SecRule REQUEST_HEADERS:X-Debug "@rx ^(1|true|on)$" \
  "id:20001,phase:1,deny,status:403,t:lowercase,log,\
   msg:'debug header from client',tag:'local/policy'"

# Virtual patch: a known vulnerable endpoint of a bundled application
# until it is upgraded (CVE style patching without touching the app).
SecRule REQUEST_URI "@beginsWith /plugins/legacy-export/run" \
  "id:20002,phase:1,deny,status:404,log,\
   msg:'virtual patch: legacy export endpoint disabled',tag:'local/virtual-patch'"

# Refuse requests whose Host header is a bare IP address: scanners walk
# address ranges, browsers send names.
SecRule REQUEST_HEADERS:Host "@rx ^\d{1,3}(\.\d{1,3}){3}(:\d+)?$" \
  "id:20003,phase:1,deny,status:400,log,\
   msg:'host header is an IP address',tag:'local/scanner'"

# Require a JSON content type on the API write methods.
SecRule REQUEST_METHOD "@rx ^(POST|PUT|PATCH)$" \
  "id:20004,phase:1,chain,deny,status:415,log,\
   msg:'API write without a JSON body',tag:'local/api'"
  SecRule REQUEST_URI "@beginsWith /api/" "chain,t:none"
  SecRule REQUEST_HEADERS:Content-Type "!@rx ^application/(json|.*\+json)" "t:lowercase"

# Score only: a suspicious path fragment adds to the anomaly score so the
# CRS threshold decides together with everything else the request does.
SecRule REQUEST_URI "@rx (?i)(/\.git/|/\.env$|/wp-config\.php)" \
  "id:20005,phase:1,pass,log,\
   msg:'well known secret path probe',tag:'local/scanner',\
   setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Response side: never let a stack trace of the bundled framework leave.
SecRule RESPONSE_BODY "@rx (?i)at [a-z0-9_.$]+\([a-z0-9_]+\.(java|kt):\d+\)" \
  "id:20006,phase:4,deny,status:502,log,\
   msg:'stack trace in response body',tag:'local/leak'"
