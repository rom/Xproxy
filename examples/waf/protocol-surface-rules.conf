# A fourth set of custom rules: the web surfaces that sit next to the
# non-HTTP protocols this proxy now speaks. A mail server, a message
# broker and a bastion each come with an administrative web interface,
# a configuration file people leave where a web server can reach it, and
# a scanner that knows both. These rules refuse the shapes those
# scanners send.
#
# Load alongside the Core Rule Set and the other custom rules:
#   waf:
#     profiles:
#       - name: default
#         crs: {paranoia_level: 1}
#         directive_files:
#           - /etc/xproxy/waf/custom-rules.conf
#           - /etc/xproxy/waf/hardening-rules.conf
#           - /etc/xproxy/waf/attack-surface-rules.conf
#           - /etc/xproxy/waf/protocol-surface-rules.conf
#
# Ids are 23001 upward, clear of the 20001, 21001 and 22001 blocks, the
# CRS (900000+) and any vendor plugin.
#
# Read each rule before loading it. An estate that genuinely serves
# webmail, a broker dashboard or a bastion's web UI through this proxy
# will be refused by the rules that name them: move that traffic to its
# own route with its own profile, or drop those rules. Start the file in
# a `mode: detect` profile and promote what is quiet.

# ---- Mail server administration --------------------------------------
# The paths that only exist on a mail server's own web interface. An
# application that is not one has nothing behind them, so a request is
# somebody looking for the mail server.
SecRule REQUEST_URI \
  "@rx (?i)^/(roundcube|rainloop|afterlogic|squirrelmail|horde|postfixadmin|mailcow|modoboa|iredadmin)(/|$)" \
  "id:23001,phase:1,deny,status:404,log,\
   msg:'webmail or mail administration path',tag:'local/mail-recon'"

# Zimbra, Exchange and the autodiscover family, which are scanned for
# continuously and have a long history of pre-authentication flaws.
SecRule REQUEST_URI \
  "@rx (?i)^/(zimbra|service/(soap|admin|extension)|owa/|ecp/|autodiscover/|powershell|mapi/|rpc/rpcproxy\.dll)" \
  "id:23002,phase:1,deny,status:404,log,\
   msg:'mail server administration endpoint',tag:'local/mail-recon'"

# A mail configuration file reached over HTTP. These are not documents
# an application serves; they are files somebody left in a web root.
SecRule REQUEST_URI \
  "@rx (?i)/(main\.cf|master\.cf|dovecot\.conf|aliases|virtual|transport|sasl_passwd|\.mailrc|\.msmtprc)$" \
  "id:23003,phase:1,deny,status:404,log,\
   msg:'mail configuration file requested',tag:'local/config-leak'"

# Header injection into a mail-sending form: a CR or LF inside a field
# that becomes a header is how one message becomes two, with recipients
# the form never offered.
SecRule ARGS_NAMES "@rx (?i)^(to|from|cc|bcc|subject|sender|reply[_-]?to|return[_-]?path)$" \
  "id:23004,phase:2,chain,deny,status:403,log,\
   msg:'line break in a mail header parameter',tag:'local/mail-injection'"
  SecRule ARGS "@rx (\r|\n|%0[ad]|%250[ad]|\\\\r|\\\\n)"

# The SMTP verbs themselves in a parameter, which is what an injection
# uses once it has a line break.
SecRule ARGS \
  "@rx (?i)(\r|\n|%0[ad])\s*(MAIL FROM|RCPT TO|DATA|BCC|CC|Content-Type)\s*:" \
  "id:23005,phase:2,deny,status:403,log,\
   msg:'SMTP command in a parameter',tag:'local/mail-injection'"

# ---- Message brokers --------------------------------------------------
# A broker dashboard's own API. An ordinary application has none of it,
# and a client that asks is enumerating the estate's messaging.
SecRule REQUEST_URI \
  "@rx (?i)^/(api/v[45]/(clients|subscriptions|topics|listeners|authorization)|mqtt/|dashboard/(overview|clients)|hawtio|activemq|rabbitmq/api)" \
  "id:23011,phase:1,deny,status:404,log,\
   msg:'message broker administration endpoint',tag:'local/broker-recon'"

# The broker's own tree, asked for through an HTTP bridge. A client that
# names it wants the broker's clients, not its own topics.
SecRule ARGS|REQUEST_URI "@rx (?i)(^|/|=|%24)\$SYS/" \
  "id:23012,phase:2,deny,status:403,log,\
   msg:'broker $SYS topic requested through HTTP',tag:'local/broker-recon'"

# A wildcard topic in a bridge parameter. Subscribing to "#" through a
# web bridge asks for the estate's whole message flow.
SecRule ARGS_NAMES "@rx (?i)^(topic|topics|filter|subscribe|sub)$" \
  "id:23013,phase:2,chain,deny,status:403,log,\
   msg:'wildcard topic subscription through HTTP',tag:'local/broker-recon'"
  SecRule ARGS "@rx ^\s*(#|\+(/.*)?|/?#)\s*$"

# A broker configuration file over HTTP.
SecRule REQUEST_URI "@rx (?i)/(mosquitto\.conf|aclfile|emqx\.conf|acl\.conf|vernemq\.conf)$" \
  "id:23014,phase:1,deny,status:404,log,\
   msg:'broker configuration file requested',tag:'local/config-leak'"

# ---- Remote access and file transfer ---------------------------------
# SSH and VPN material reached over HTTP. A private key or a known_hosts
# file in a web root is a mistake, and the request for it is not.
SecRule REQUEST_URI \
  "@rx (?i)/(\.ssh/(id_[a-z0-9]+|authorized_keys|known_hosts|config)|sshd_config|\.ovpn|wg[0-9]*\.conf|client\.ovpn)$" \
  "id:23021,phase:1,deny,status:404,log,\
   msg:'remote access credential or configuration requested',tag:'local/config-leak'"

# A saved-session file from an FTP or SFTP client. Each of these holds
# stored passwords by design.
SecRule REQUEST_URI \
  "@rx (?i)/(sitemanager\.xml|recentservers\.xml|filezilla\.xml|WinSCP\.ini|ws_ftp\.ini|ftpsync\.settings|\.ftpconfig|sftp-config\.json)$" \
  "id:23022,phase:1,deny,status:404,log,\
   msg:'file transfer client session file requested',tag:'local/config-leak'"

# The web front doors of remote access tools, which are scanned for
# because a session through one is a session on the hosts behind it.
SecRule REQUEST_URI \
  "@rx (?i)^/(guacamole|webmin|cockpit|rport|meshcentral|rustdesk|teleport/(web|webapi)|web/login\?redirect_uri)" \
  "id:23023,phase:1,deny,status:404,log,\
   msg:'remote access console path',tag:'local/remote-access-recon'"

# A private key in a request body. Whatever the upload is for, a key
# arriving through a form is either an accident or an exfiltration.
SecRule REQUEST_BODY|ARGS \
  "@rx -----BEGIN (RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----" \
  "id:23024,phase:2,deny,status:403,log,\
   msg:'private key in a request',tag:'local/key-material'"

# ---- Proxy and tunnel abuse ------------------------------------------
# An absolute URI in the request line reaching a reverse proxy means the
# client thinks this is a forward proxy. It is not, and a proxy that
# answered would be an open one.
SecRule REQUEST_LINE "@rx (?i)^[A-Z]+\s+(https?|ftp|socks[45]?)://" \
  "id:23031,phase:1,deny,status:400,log,\
   msg:'absolute URI to a reverse proxy',tag:'local/open-proxy'"

# The extended CONNECT protocols, asked for on a listener that does not
# offer them. A client that names one is looking for a tunnel.
SecRule REQUEST_HEADERS:X-Forwarded-Proto|ARGS \
  "@rx (?i)^(connect-udp|connect-ip|connect-tcp)$" \
  "id:23032,phase:1,deny,status:400,log,\
   msg:'tunnel protocol named in a request',tag:'local/open-proxy'"

# A well-known MASQUE path on a listener that is not a forward proxy.
SecRule REQUEST_URI "@rx (?i)^/\.well-known/masque/" \
  "id:23033,phase:1,deny,status:404,log,\
   msg:'MASQUE target path on a reverse proxy',tag:'local/open-proxy'"

# ---- Scanner behaviour ------------------------------------------------
# The user agents of the protocol scanners that go with all of the
# above. A real client of a web application is none of them.
SecRule REQUEST_HEADERS:User-Agent \
  "@rx (?i)(zgrab|masscan|nmap|nuclei|zmap|mqtt-?explorer|paho|libmosquitto|sshscan|hydra|medusa|ncrack|smtp-user-enum|ismtp|swaks)" \
  "id:23041,phase:1,deny,status:403,log,\
   msg:'protocol scanner user agent',tag:'local/scanner'"

# A request that names a port in a parameter alongside a host. Together
# they are a connect request, whatever the application meant the fields
# for.
SecRule ARGS_NAMES "@rx (?i)^(port|dport|dest_port|target_port)$" \
  "id:23042,phase:2,chain,deny,status:403,log,\
   msg:'port and host in parameters: a connect request in a form',tag:'local/ssrf'"
  SecRule ARGS "@rx ^\s*(22|23|25|110|143|445|465|587|993|995|1433|1883|3306|3389|5432|6379|8883|9200|11211|27017)\s*$"
