# Example WAF exclusions for the OWASP Core Rule Set.
#
# Load with:
#   waf:
#     profiles:
#       - name: default
#         crs: {paranoia_level: 1}
#         directive_files: [/etc/xproxy/waf/exclusions.conf]
#
# Exclusions load after the CRS setup and before the CRS rules, which is
# the position the CRS documents for ctl:ruleRemove* actions. Rule ids
# 1 to 99,999 are reserved for local rules; keep every id unique across
# all files of a profile. Review the learning proposals
# (xproxyctl waf proposals) before copying them here.

# --- Path scoped target exclusions -------------------------------------

# A rich text editor posts HTML in the "body" field of /posts: keep the
# XSS rules for every other parameter, skip the whole family for this
# one (by tag; single rules would be ctl:ruleRemoveTargetById=941100;ARGS:body
# and so on, which is what the learning proposals emit).
SecRule REQUEST_URI "@beginsWith /posts" \
  "id:10001,phase:1,pass,t:none,nolog,\
   ctl:ruleRemoveTargetByTag=attack-xss;ARGS:body"

# A search form sends free text that trips SQL injection heuristics at
# paranoia level 2; the application uses prepared statements.
SecRule REQUEST_URI "@streq /search" \
  "id:10002,phase:1,pass,t:none,nolog,\
   ctl:ruleRemoveTargetById=942100;ARGS:q,\
   ctl:ruleRemoveTargetById=942190;ARGS:q"

# --- Whole rule removal for one path --------------------------------------

# A webhook receiver gets JSON with arbitrary keys from a trusted partner;
# argument name rules produce noise there. The rest of the CRS stays on.
SecRule REQUEST_URI "@beginsWith /hooks/partner/" \
  "id:10003,phase:1,pass,t:none,nolog,\
   ctl:ruleRemoveById=920272,\
   ctl:ruleRemoveById=942430"

# --- Profile wide target exclusions --------------------------------------

# A session cookie whose random value looks like an attack payload to
# several rule families. Excluding one cookie is narrower than lowering
# the paranoia level. This file loads before the CRS rules, so the
# exclusion is a per request ctl action (SecRuleUpdateTargetById would
# need the rules to be loaded already and belongs after them).
SecAction \
  "id:10010,phase:1,pass,t:none,nolog,\
   ctl:ruleRemoveTargetById=942440;REQUEST_COOKIES:app_session,\
   ctl:ruleRemoveTargetById=942450;REQUEST_COOKIES:app_session,\
   ctl:ruleRemoveTargetById=920230;REQUEST_COOKIES:app_session"

# --- Method and body handling ----------------------------------------------

# Uploads to /files go through the body size and content type checks but
# skip body inspection (binary data, inspected by ICAP instead).
SecRule REQUEST_URI "@beginsWith /files/upload" \
  "id:10004,phase:1,pass,t:none,nolog,ctl:requestBodyAccess=Off"
