# WAF configuration example: two profiles, detect mode roll-out for the
# marketing site, block mode with a stricter paranoia level for the API,
# the exclusion and custom rule files from this directory, a CRS plugin
# directory and a JSON body schema for the API, learning and anomaly
# detection on.
#
# Validate: xproxy -config examples/waf/waf.yaml -validate
version: 1
server:
  listeners:
    - {name: main, address: "0.0.0.0:8080"}
management:
  socket: /run/xproxy/mgmt.sock
logging:
  directory: /var/log/xproxy
waf:
  default_mode: detect
  default_profile: web
  inspect_responses: true
  learning: {enabled: true, min_hits: 10}
  # Clients whose rate, rule matches, errors or path spread stand out
  # from the rest by four standard deviations are challenged.
  anomaly: {enabled: true, window: 5m, min_requests: 30, threshold: 4, action: challenge}
  profiles:
    - name: web
      crs:
        paranoia_level: 1
        # CRS plugins from this directory (loose files or checked out
        # plugin repositories); the example plugin denies listed agents.
        plugins_dir: /etc/xproxy/waf/plugins
      directive_files:
        - /etc/xproxy/waf/exclusions.conf
        - /etc/xproxy/waf/custom-rules.conf
        - /etc/xproxy/waf/hardening-rules.conf
        # The third file refuses shapes rather than payloads, so it is
        # loaded into this detect-mode profile first. Read its header
        # before promoting it: an application that fetches `file://`
        # URLs or takes SVG uploads is refused by it.
        - /etc/xproxy/waf/attack-surface-rules.conf
    - name: api
      crs: {paranoia_level: 2, inbound_threshold: 5}
      directive_files:
        - /etc/xproxy/waf/custom-rules.conf
        - /etc/xproxy/waf/hardening-rules.conf
        - /etc/xproxy/waf/attack-surface-rules.conf
      # Order writes must match the schema before the rules see them.
      json_schemas:
        - name: order
          paths: [/api/orders]
          methods: [POST, PUT]
          schema_file: /etc/xproxy/waf/order-schema.json
          required: true
    - name: updated
      # Rules from a directory in the release layout instead of the
      # embedded copy: a new CRS release applies with a reload.
      crs: {dir: /etc/xproxy/crs, paranoia_level: 1}
upstreams:
  - name: web
    endpoints: [{address: "10.0.0.10:8080"}]
  - name: api
    endpoints: [{address: "10.0.0.20:8080"}]
routes:
  - {name: api, hosts: [api.example.com], upstream: api, waf: {mode: block, profile: api}}
  - {name: uploads, hosts: [www.example.com], paths: [/files/upload], upstream: web, waf: {mode: off}}
  - {name: web, hosts: [www.example.com], upstream: web}
bans:
  action: drop
  triggers:
    - {name: waf-repeat, reasons: [waf], threshold: 5, window: 1m, duration: 15m}
