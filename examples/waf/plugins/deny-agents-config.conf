# Example CRS plugin: deny requests from listed user agents.
# Layout: <plugin>-config.conf loads first, <plugin>-before.conf before
# the CRS rules, <plugin>-after.conf after them. Data files sit next to
# the plugin files. Plugin rule ids belong in the 9,500,000 to 9,599,999
# range that the CRS reserves for plugins.
SecAction "id:9510000,phase:1,pass,t:none,nolog,setvar:tx.deny_agents_enabled=1"
