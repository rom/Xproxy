# Deny before the CRS evaluates the request: no anomaly score, a plain 403.
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile deny-agents.data" "id:9510100,phase:1,deny,status:403,log,msg:'Denied user agent',tag:'attack-reputation-scanner',tag:'plugin-deny-agents',chain"
    SecRule TX:deny_agents_enabled "@eq 1" "t:none"
