# A third set of custom rules: the classes of attack that arrive as a
# recognisable shape rather than as a payload the application will
# mis-parse. Each one refuses something no legitimate client of an
# ordinary web application sends.
#
# Load alongside the Core Rule Set and the other custom rules:
#   waf:
#     profiles:
#       - name: default
#         crs: {paranoia_level: 1}
#         directive_files:
#           - /etc/xproxy/waf/custom-rules.conf
#           - /etc/xproxy/waf/hardening-rules.conf
#           - /etc/xproxy/waf/attack-surface-rules.conf
#
# Ids are 22001 upward, so they never collide with the 20001 block in
# custom-rules.conf, the 21001 block in hardening-rules.conf, the CRS
# (900000+) or a vendor plugin. Every rule carries a phase, a message
# and a tag, so `xproxyctl waf rules` and the security log name it.
#
# Read each rule before loading it. These refuse shapes rather than
# payloads, and an application that genuinely uses one of them (a URL
# fetcher with a `file://` mode, a Mongo-style query API, an upload
# form that takes SVG) will be refused. Start the file in a
# `mode: detect` profile and promote what is quiet.

# ---- Server side request forgery -------------------------------------
# The cloud metadata services, by every address they answer on. A
# parameter carrying one of these is a request for the instance's own
# credentials, never a link a person followed.
SecRule ARGS|REQUEST_HEADERS|REQUEST_BODY \
  "@rx (?i)(169\.254\.169\.254|metadata\.google\.internal|\[?fd00:ec2::254\]?|100\.100\.100\.200|metadata\.azure\.com)" \
  "id:22001,phase:2,deny,status:403,log,\
   msg:'cloud metadata address in the request',tag:'local/ssrf'"

# Schemes a URL parameter has no business carrying. http and https are
# not here: fetching those may be the feature.
SecRule ARGS "@rx (?i)^\s*(file|gopher|dict|ldap|ldaps|jar|netdoc|tftp|sftp|smb)://" \
  "id:22002,phase:2,deny,status:403,log,\
   msg:'non-web scheme in a parameter',tag:'local/ssrf'"

# ---- Local file inclusion --------------------------------------------
# The files every traversal probe asks for, after the proxy's own
# normalisation has already refused the dot segments.
SecRule ARGS \
  "@rx (?i)(/etc/(passwd|shadow|group|hosts)|/proc/self/(environ|cmdline|fd)|/windows/win\.ini|\\\\windows\\\\system32)" \
  "id:22003,phase:2,deny,status:403,log,\
   msg:'system file requested in a parameter',tag:'local/lfi'"

# PHP stream wrappers: the way a file inclusion becomes code execution.
SecRule ARGS "@rx (?i)(php|data|expect|zip|phar|glob|compress\.(zlib|bzip2))://" \
  "id:22004,phase:2,deny,status:403,log,\
   msg:'stream wrapper in a parameter',tag:'local/lfi'"

# ---- Deserialisation --------------------------------------------------
# A serialised Java object, base64 or hex. Nothing a browser sends
# begins this way.
SecRule ARGS|REQUEST_BODY|REQUEST_COOKIES "@rx (rO0AB|\xac\xed\x00\x05|aced0005)" \
  "id:22005,phase:2,deny,status:403,log,\
   msg:'serialised Java object in the request',tag:'local/deserialize'"

# A serialised PHP object or array, which is how object injection
# arrives in a cookie or a form field.
SecRule ARGS|REQUEST_BODY|REQUEST_COOKIES "@rx (?i)(^|[;&=\"'\[{,])(O|C):\d{1,4}:\"[a-z_\\\\][a-z0-9_\\\\]{0,64}\":\d{1,4}:\{" \
  "id:22006,phase:2,deny,status:403,log,\
   msg:'serialised PHP object in the request',tag:'local/deserialize'"

# A YAML or Ruby tag that constructs an object while parsing.
SecRule REQUEST_BODY|ARGS "@rx (?i)(!!python/(object|module|name)|!ruby/(object|struct)|!!java\.)" \
  "id:22007,phase:2,deny,status:403,log,\
   msg:'object constructing tag in the body',tag:'local/deserialize'"

# ---- XML external entities -------------------------------------------
# A support rule first, and it has a cost worth understanding. An XML
# body is parsed into XML variables, and the parser skips everything
# before the root element — which is exactly where an entity
# declaration lives, so no rule can see it. This switches XML bodies to
# the raw body processor, which keeps REQUEST_BODY for the rule below.
# The cost: rules that read `XML:/*` see nothing on those requests, and
# the body is also parsed as if it were a form, which can set odd
# parameters. An estate whose API really speaks XML should drop this
# rule and 22008 together and inspect the document at the application.
# Ids in the 22900 block are support rules: they refuse nothing
# themselves.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*(application|text)/([a-z0-9.+-]+\+)?xml" \
  "id:22901,phase:1,pass,nolog,ctl:requestBodyProcessor=URLENCODED,\
   tag:'local/support'"

# The same for JSON, in the other direction: a JSON body is not parsed
# at all unless something asks for it, so without the Core Rule Set
# (which sets this itself) a JSON API is inspected by nothing below.
SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^\s*(application|text)/([a-z0-9.+-]+\+)?json" \
  "id:22902,phase:1,pass,nolog,ctl:requestBodyProcessor=JSON,\
   tag:'local/support'"

# An inline DOCTYPE with an external identifier. A document that needs
# one is a document generated by something other than a client.
SecRule REQUEST_BODY|ARGS "@rx (?i)<!(doctype|entity)[^>]{0,400}(system|public)\s" \
  "id:22008,phase:2,deny,status:403,log,\
   msg:'external entity declaration in the body',tag:'local/xxe'"

# ---- NoSQL injection --------------------------------------------------
# A query operator as a parameter name. A form field is never called
# "$where".
SecRule ARGS_NAMES \
  "@rx (?i)^\$(where|ne|gt|gte|lt|lte|regex|in|nin|exists|expr|function|accumulator)$" \
  "id:22009,phase:2,deny,status:403,log,\
   msg:'query operator as a parameter name',tag:'local/nosql'"

# The same operators arriving as a key of a JSON body, which is
# flattened into parameters named for their path (`json.$where`).
SecRule ARGS_NAMES "@rx (?i)\.\$(where|function|accumulator|expr)$" \
  "id:22010,phase:2,deny,status:403,log,\
   msg:'executing query operator in a JSON body',tag:'local/nosql'"

# ---- Command injection ------------------------------------------------
# A shell separator followed by a program an attacker reaches for. The
# separator alone is ordinary in prose; the pair is not.
SecRule ARGS|REQUEST_HEADERS:Referer \
  "@rx (?i)[;&|]\s*/?(bin/)?(curl|wget|nc|ncat|netcat|bash|/bin/sh|python[23]?|perl|ruby|powershell|certutil|bitsadmin|nslookup)[\s;|&]" \
  "id:22011,phase:2,deny,status:403,log,\
   msg:'shell command in a parameter',tag:'local/rce'"

# Command substitution. Scored rather than refused: a parameter can
# legitimately carry a price in a currency that uses parentheses, and
# the CRS threshold decides together with everything else.
SecRule ARGS "@rx (\$\([^)]{1,60}\)|`[^`]{1,60}`)" \
  "id:22012,phase:2,pass,log,\
   msg:'command substitution in a parameter',tag:'local/rce',\
   setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Spring Cloud Function's routing expression header, which evaluates
# SpEL. There is no client-side reason to send it.
SecRule REQUEST_HEADERS_NAMES "@rx (?i)^spring\.cloud\.function\.routing-expression$" \
  "id:22013,phase:1,deny,status:403,log,\
   msg:'SpEL routing expression header',tag:'local/rce'"

# Shellshock: a function definition at the start of a header value.
SecRule REQUEST_HEADERS "@rx \(\s*\)\s*\{" \
  "id:22014,phase:1,deny,status:403,log,\
   msg:'shell function definition in a header',tag:'local/rce'"

# ---- Request smuggling shapes ----------------------------------------
# A Transfer-Encoding header that is anything but the single token
# `chunked` is an attempt to be read differently by two servers.
SecRule REQUEST_HEADERS:Transfer-Encoding "@rx (?i)(,|;|\s|x-|identity|chunk[^e]|[^d]$)" \
  "id:22015,phase:1,deny,status:400,log,\
   msg:'obfuscated Transfer-Encoding',tag:'local/smuggling'"

# Both framing headers on one request. RFC 9112 says to ignore the
# length; two servers in a row may not agree on that.
SecRule &REQUEST_HEADERS:Transfer-Encoding "@ge 1" \
  "id:22016,phase:1,chain,deny,status:400,log,\
   msg:'Transfer-Encoding and Content-Length together',tag:'local/smuggling'"
  SecRule &REQUEST_HEADERS:Content-Length "@ge 1" "t:none"

# ---- Cache poisoning and routing headers ------------------------------
# Headers that change what the origin thinks the request was. The proxy
# decides routing; a client that wants a say is attacking the cache.
SecRule REQUEST_HEADERS_NAMES \
  "@rx (?i)^x-(original-url|rewrite-url|forwarded-host|forwarded-scheme|forwarded-prefix|http-method-override|method-override|original-host)$" \
  "id:22017,phase:1,deny,status:403,log,\
   msg:'routing or override header from the client',tag:'local/cache'"

# Web cache deception: a static extension bolted onto a path that
# serves a person's own data, so a cache stores the answer under a URL
# anyone can ask for.
SecRule REQUEST_URI "@rx (?i)^/(account|profile|settings|admin|dashboard|api)/" \
  "id:22018,phase:1,chain,deny,status:404,log,\
   msg:'static extension on a private path',tag:'local/cache'"
  SecRule REQUEST_FILENAME "@rx (?i)\.(css|js|png|jpe?g|gif|ico|svg|woff2?|txt|map)$" "t:none"

# ---- Prototype pollution ----------------------------------------------
# A parameter that names an object's internals rather than a field.
SecRule ARGS_NAMES "@rx (?i)(^|[\[.])(__proto__|constructor|prototype)([\[\].]|$)" \
  "id:22019,phase:2,deny,status:403,log,\
   msg:'prototype pollution parameter name',tag:'local/pollution'"

# ---- Header and redirect injection ------------------------------------
# A line break and a header name inside a parameter: the application is
# about to write both into its answer.
SecRule ARGS "@rx (?i)[\r\n]\s*(set-cookie|location|content-length|content-type|transfer-encoding)\s*:" \
  "id:22020,phase:2,deny,status:403,log,t:urlDecodeUni,\
   msg:'header injection in a parameter',tag:'local/crlf'"

# An off-site destination in a redirect parameter. Scored, not refused:
# a legitimate return-to link can be absolute, and an estate that never
# redirects off site should promote this to a deny.
SecRule ARGS:next|ARGS:url|ARGS:redirect|ARGS:redirect_uri|ARGS:return|ARGS:returnUrl|ARGS:continue|ARGS:dest \
  "@rx (?i)^\s*([/\\]{2}|https?:[/\\]{2}|[a-z][a-z0-9+.-]*:)" \
  "id:22021,phase:2,pass,log,\
   msg:'absolute destination in a redirect parameter',tag:'local/redirect',\
   setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# ---- Diagnostics that must not be reachable ---------------------------
# Debugger session parameters and cookies. A production application
# does not offer them; a scanner asks anyway.
SecRule ARGS_NAMES|REQUEST_COOKIES_NAMES \
  "@rx (?i)^(xdebug_session(_start|_stop)?|phpinfo|apc_clear|opcache_reset|debug_toolbar)$" \
  "id:22022,phase:2,deny,status:403,log,\
   msg:'debugger or diagnostic parameter',tag:'local/debug'"

# ---- Uploads that execute in a browser --------------------------------
# An SVG or an HTML document served back from an upload directory runs
# script on the origin. The executable extensions are refused by rule
# 21008; these are the ones that execute on the client instead.
SecRule FILES "@rx (?i)\.(svg|svgz|html?|xhtml|xht|shtml|xml|swf|hta|mhtml?)$" \
  "id:22023,phase:2,deny,status:415,log,\
   msg:'upload that executes in a browser',tag:'local/upload'"

# ---- Tools that announce themselves -----------------------------------
# Not a control on its own — a user agent is a string the client
# chooses — but the ones that still arrive unchanged are worth refusing
# and, through the ban trigger on reason `waf`, worth an hour of
# nothing.
SecRule REQUEST_HEADERS:User-Agent \
  "@rx (?i)(sqlmap|nikto|nessus|nuclei|wpscan|acunetix|netsparker|masscan|zgrab|zmap|dirbuster|gobuster|feroxbuster|ffuf|wfuzz|arachni|w3af|openvas|qualys|whatweb|joomscan|droopescan|xsstrike|commix)" \
  "id:22024,phase:1,deny,status:403,log,\
   msg:'scanner user agent',tag:'local/scanner'"

# A write with no user agent at all. Every browser and every library
# sends one; a hand-rolled exploit often does not.
SecRule REQUEST_METHOD "@rx ^(POST|PUT|PATCH|DELETE)$" \
  "id:22025,phase:1,chain,deny,status:400,log,\
   msg:'write request without a user agent',tag:'local/scanner'"
  SecRule &REQUEST_HEADERS:User-Agent "@eq 0" "t:none"

# ---- What must never leave --------------------------------------------
# An interpreter's own error page names the file, the line and often
# the query. The Java stack trace is rule 20006; these are the rest.
SecRule RESPONSE_BODY \
  "@rx (Traceback \(most recent call last\)|Fatal error: Uncaught|Warning: (include|require)(_once)?\(|<b>(Notice|Warning|Deprecated)</b>:|Microsoft OLE DB Provider|System\.Data\.SqlClient\.)" \
  "id:22026,phase:4,deny,status:502,log,\
   msg:'interpreter error page in response body',tag:'local/leak'"

# A directory listing where the application should have answered.
SecRule RESPONSE_BODY "@rx (?i)<title>Index of /" \
  "id:22027,phase:4,deny,status:502,log,\
   msg:'directory listing in response body',tag:'local/leak'"
