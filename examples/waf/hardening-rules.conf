# A second set of custom rules: the shapes a WAF is better placed to
# refuse than the application is, and the two or three virtual patches
# every estate ends up writing by hand.
#
# Load alongside the Core Rule Set and the other custom rules:
#   waf:
#     profiles:
#       - name: default
#         crs: {paranoia_level: 1}
#         directive_files:
#           - /etc/xproxy/waf/custom-rules.conf
#           - /etc/xproxy/waf/hardening-rules.conf
#
# Ids are 21001 upward, so they never collide with the 20001 block in
# custom-rules.conf, with the CRS (900000+) or with a vendor plugin.
# Each rule carries a phase, a message and a tag, so `xproxyctl waf
# rules` and the security log name it; `tag:'local/...'` is what makes
# a whole theme greppable in the statistics.
#
# Read each rule before loading it. Two of them (21009, 21010) refuse
# request shapes a badly written client can produce, and one (21012)
# turns off GraphQL introspection, which a development front end may
# want. Start them in a `mode: detect` profile and promote what is
# quiet.

# ---- Editor and backup leftovers ------------------------------------
# A path ending in a backup or editor suffix is never a resource the
# application means to serve; it is a copy somebody left behind. 404
# rather than 403, so the answer does not confirm the file is there.
SecRule REQUEST_FILENAME "@rx (?i)(\.(bak|old|orig|save|swp|swo|tmp|orig|rej|sql|sql\.gz|tar|tar\.gz|tgz|zip|7z|rar|log)|~)$" \
  "id:21001,phase:1,deny,status:404,log,\
   msg:'backup or editor leftover requested',tag:'local/leftovers'"

# A version control or dependency directory anywhere in the path.
SecRule REQUEST_URI "@rx (?i)/(\.git|\.svn|\.hg|\.bzr|node_modules|vendor/composer|\.idea|\.vscode)(/|$)" \
  "id:21002,phase:1,deny,status:404,log,\
   msg:'source or dependency directory requested',tag:'local/leftovers'"

# ---- Template and expression injection -------------------------------
# Server side template injection probes are short, distinctive and
# almost never legitimate in a query string. Scored rather than denied,
# and scored at warning rather than critical, so one of them is not a
# refusal on its own: the CRS threshold decides together with
# everything else the request does.
SecRule ARGS|REQUEST_HEADERS:Referer "@rx (\{\{.{0,40}\}\}|\$\{.{0,40}\}|<%=.{0,40}%>|#\{.{0,40}\})" \
  "id:21003,phase:2,pass,log,\
   msg:'template expression in a parameter',tag:'local/ssti',\
   setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# JNDI lookups (Log4Shell and its relatives) in any header, parameter or
# body. This one denies: there is no legitimate request that carries it,
# and it is the single most probed string of the last few years.
#
# Two alternatives, because the payload is written to be unrecognisable.
# The first is a lookup naming one of the schemes or the string
# functions an obfuscated payload is assembled from. The second is an
# expression opened inside another expression, which is how
# ${${::-j}ndi:...} hides the word itself: the parts are meaningless
# separately, but nothing legitimate nests a lookup in an HTTP field.
SecRule REQUEST_HEADERS|ARGS|ARGS_NAMES|REQUEST_BODY|XML:/* \
  "@rx (?i)(\$\{[^}]{0,20}(jndi|ldap|rmi|dns|nis|iiop|corba|nds|env|sys|lower|upper|date)[^}]{0,80}\}|\$\{[^}]{0,60}\$\{)" \
  "id:21004,phase:2,deny,status:403,log,\
   msg:'JNDI or nested expression lookup',tag:'local/jndi',tag:'CVE-2021-44228'"

# Spring's data binder reaching the class loader (Spring4Shell). The
# parameter name is the payload, so the name is what is inspected.
SecRule ARGS_NAMES "@rx (?i)(^|\.)(class|Class)\.(module|classLoader|classloader)\." \
  "id:21005,phase:2,deny,status:403,log,\
   msg:'class loader reached through a bound parameter',tag:'local/spring',tag:'CVE-2022-22965'"

# ---- Container confusion --------------------------------------------
# `..;/` and a path parameter before a segment are how a request reaches
# a servlet container's protected path while looking ordinary to what is
# in front of it. The proxy normalises the path before routing; this
# refuses the request outright so the origin never sees the attempt.
SecRule REQUEST_URI_RAW "@rx (?i)(\.\.;|;/|/\.\.;|%2e%2e;|;jsessionid=[^/?]{0,64}/)" \
  "id:21006,phase:1,deny,status:400,log,\
   msg:'path parameter or ..; segment in the request line',tag:'local/smuggling'"

# ---- Methods nobody should be using ---------------------------------
# TRACE and TRACK reflect the request, including headers a script cannot
# otherwise read; DEBUG is a development verb. None of them belongs on
# an origin behind a proxy.
SecRule REQUEST_METHOD "@rx ^(TRACE|TRACK|DEBUG)$" \
  "id:21007,phase:1,deny,status:405,log,\
   msg:'diagnostic HTTP method',tag:'local/policy'"

# ---- Uploads that are not what they claim ---------------------------
# A file part whose name ends in something the origin might execute. The
# upload_guard filter enforces types properly; this catches the obvious
# case early and names it in the WAF statistics.
SecRule FILES "@rx (?i)\.(php\d?|phtml|phar|jsp|jspx|asp|aspx|ashx|cshtml|cgi|pl|py|rb|sh|bash|exe|dll|jar|war)($|\.)" \
  "id:21008,phase:2,deny,status:415,log,\
   msg:'uploaded file name is executable',tag:'local/upload'"

# ---- Bounded requests ------------------------------------------------
# A query string with a hundred parameters, or a request with fifty
# cookies, is a fuzzer or a parser attack, not a form. Refuse rather
# than hand the origin something it will parse quadratically.
SecRule &ARGS "@gt 100" \
  "id:21009,phase:2,deny,status:400,log,\
   msg:'more than a hundred parameters',tag:'local/bounds'"

SecRule &REQUEST_COOKIES "@gt 50" \
  "id:21010,phase:1,deny,status:400,log,\
   msg:'more than fifty cookies',tag:'local/bounds'"

# A Range header asking for many ranges makes the origin assemble a
# multipart response many times the size of the resource.
SecRule REQUEST_HEADERS:Range "@rx ^bytes=(\s*\d*\s*-\s*\d*\s*,){10,}" \
  "id:21011,phase:1,deny,status:416,log,\
   msg:'many byte ranges in one request',tag:'local/bounds'"

# ---- GraphQL ---------------------------------------------------------
# Introspection is how an attacker reads the whole schema in one
# request. The graphql filter bounds depth and complexity; this turns
# introspection off on the production endpoint.
SecRule REQUEST_URI "@rx (?i)^/(api/)?graphql" \
  "id:21012,phase:2,chain,deny,status:403,log,\
   msg:'GraphQL introspection',tag:'local/api'"
  SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@rx (?i)__schema|__type\s*\(" "t:none"

# ---- What must never leave ------------------------------------------
# A private key or a cloud access key in a response body is a leak
# whatever produced it. The sensitive_data filter reports these with a
# category and a count; this refuses the response as well, so a
# misconfigured origin cannot serve the key twice.
SecRule RESPONSE_BODY "@rx -----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----" \
  "id:21013,phase:4,deny,status:502,log,\
   msg:'private key in response body',tag:'local/leak'"

SecRule RESPONSE_BODY "@rx (?i)\b(AKIA|ASIA)[0-9A-Z]{16}\b|\bAIza[0-9A-Za-z_\-]{35}\b|\bghp_[0-9A-Za-z]{36}\b" \
  "id:21014,phase:4,deny,status:502,log,\
   msg:'cloud or platform access key in response body',tag:'local/leak'"

# An SQL error message tells an attacker the injection worked and names
# the engine. Refuse the response rather than let the origin describe
# its own database.
SecRule RESPONSE_BODY "@rx (?i)(SQLSTATE\[|ORA-[0-9]{5}|PG::[A-Za-z]+Error|You have an error in your SQL syntax|Unclosed quotation mark after)" \
  "id:21015,phase:4,deny,status:502,log,\
   msg:'database error message in response body',tag:'local/leak'"
