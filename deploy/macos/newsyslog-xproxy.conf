# newsyslog rotation for the xproxy log streams. Install to
# /etc/newsyslog.d/xproxy.conf. After rotation the daemon is told to
# reopen its files; the sandbox lets it write the new ones.
# logfilename                                  [owner:group]      mode count size when  flags [/pid_file] [sig_num]
/usr/local/var/log/xproxy/access.log           _xproxy:_xproxy    640  30    *    $D0   JN    /usr/local/var/run/xproxy/xproxy.pid 30
/usr/local/var/log/xproxy/error.log            _xproxy:_xproxy    640  30    *    $D0   JN    /usr/local/var/run/xproxy/xproxy.pid 30
/usr/local/var/log/xproxy/security.log         _xproxy:_xproxy    640  90    *    $D0   JN    /usr/local/var/run/xproxy/xproxy.pid 30
/usr/local/var/log/xproxy/audit.log            _xproxy:_xproxy    640  365   *    $D0   JN    /usr/local/var/run/xproxy/xproxy.pid 30
/usr/local/var/log/xproxy/launchd.log          _xproxy:_xproxy    640  10    1024 *     J
