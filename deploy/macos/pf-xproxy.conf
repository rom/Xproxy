# pf anchor for an xproxy host. Include from /etc/pf.conf with
#   anchor "xproxy"
#   load anchor "xproxy" from "/usr/local/etc/xproxy/pf-xproxy.conf"
# and apply with `sudo pfctl -f /etc/pf.conf` (persist with the
# com.apple.pfctl launchd job, see docs/HARDENING_MACOS.md).
#
# Policy: drop everything inbound except SSH from the management range,
# the proxy ports with a per-source rate on new connections, and ICMP
# needed for path MTU discovery. Outbound is open for the proxy's own
# upstream, DNS, ACME and OCSP traffic.

mgmt_net = "{ 10.0.0.0/8 }"
proxy_ports = "{ 80, 443 }"
table <xproxy_abusers> persist

set block-policy drop
set skip on lo0

block in log all
pass out all keep state

# Management access.
pass in quick proto tcp from $mgmt_net to any port 22 flags S/SA keep state

# Proxy traffic with a new connection rate per source: more than 100 new
# connections in 5 seconds from one address puts it in the abusers table
# for the rest of the state lifetime; the table is flushed by the
# operator or a cron job (pfctl -t xproxy_abusers -T expire 3600).
block in quick from <xproxy_abusers>
pass in quick proto tcp to any port $proxy_ports flags S/SA keep state \
    (max-src-conn 512, max-src-conn-rate 100/5, overload <xproxy_abusers> flush global)
pass in quick proto udp to any port 443 keep state \
    (max-src-states 256)

# ICMP for path MTU discovery and diagnostics.
pass in quick inet proto icmp icmp-type { echoreq, unreach }
pass in quick inet6 proto icmp6 icmp6-type { echoreq, unreach, toobig, neighbrsol, neighbradv }
