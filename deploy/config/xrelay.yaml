# Example xrelay configuration: the relay daemon, the protocols machines
# speak to each other. Every omitted value takes a conservative default;
# see docs/CONFIG.md for the full reference.
#
# Validate before starting: xrelay -config /etc/xproxy/xrelay.yaml -validate
version: 1

# The shared fragments, as in xgate.yaml.
# includes: [/etc/xproxy/estate.d/*.yaml]

server:
  listeners:
    - name: submission
      address: "0.0.0.0:587"
      kind: smtp
      tls:
        certificates:
          - {cert_file: /etc/xproxy/certs/mail.pem, key_file: /etc/xproxy/certs/mail-key.pem}
      smtp:
        upstream: mail
        tls_mode: starttls
        require_tls: true
    - name: telemetry
      address: "0.0.0.0:1883"
      kind: mqtt
      mqtt:
        upstream: broker

management:
  socket: /run/xrelay/mgmt.sock
  socket_mode: "0660"
  history_dir: /var/lib/xrelay/history
metrics:
  listen: "127.0.0.1:9102"
logging:
  directory: /var/log/xrelay
  access: {enabled: true}

upstreams:
  - name: mail
    endpoints: [{address: "10.20.2.25:25"}]
  - name: broker
    endpoints: [{address: "10.20.3.83:1883"}]
