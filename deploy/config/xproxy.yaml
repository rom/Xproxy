# Example xproxy configuration. Every omitted value takes a conservative
# default; see docs/CONFIG.md for the full reference.
version: 1

server:
  listeners:
    - name: public-http
      address: ":80"
      redirect_to_https: true
    - name: public
      address: ":443"
      protocols: [h1, h2, h3]        # h3 adds a QUIC endpoint on UDP 443
      h3:
        max_streams: 100
        validate_addresses: always
      tls:
        min_version: "1.2"
        certificates:
          - cert_file: /etc/xproxy/certs/example.com.pem
            key_file: /etc/xproxy/certs/example.com-key.pem
        # Certificates obtained and renewed automatically (needs the acme
        # section below). One certificate per group, selected by SNI like
        # the file based ones.
        acme:
          - hosts: [shop.example.com, www.shop.example.com]
  limits:
    max_header_bytes: 65536
    max_body_bytes: 10485760        # 10 MiB
    read_header_timeout: 10s
    read_timeout: 60s
    write_timeout: 60s
    idle_timeout: 120s
    max_connections: 65536
    max_connections_per_ip: 256
    max_concurrent_requests: 16384
  shutdown_timeout: 30s

management:
  socket: /run/xproxy/mgmt.sock
  socket_mode: "0660"

# Prometheus: /metrics is always on the management socket; this adds a
# scrape endpoint on the internal interface for the monitoring servers.
metrics:
  listen: 10.0.0.1:9100
  allow_cidrs: [10.0.5.0/24]
  sample_interval: 10s
  retention: 1h

logging:
  directory: /var/log/xproxy
  level: info
  access:   {file: access.log,   max_size_mb: 512, max_files: 10, sinks: [file]}
  error:    {file: error.log,    max_size_mb: 64,  max_files: 5,  sinks: [file, journald]}
  security: {file: security.log, max_size_mb: 256, max_files: 10, sinks: [file, journald, syslog]}
  audit:    {file: audit.log,    max_size_mb: 64,  max_files: 20, sinks: [file, syslog]}
  journald: {identifier: xproxy}
  syslog:                                   # remote collector for security and audit
    network: tcp+tls
    address: logs.example.internal:6514
    ca_file: /etc/xproxy/certs/logs-ca.pem
    server_name: logs.example.internal
    facility: local3
  redaction:                                # personal data rules, audit stream exempt
    client_ip: hash
    hash_secret_file: /var/lib/xproxy/redaction.key
    user_agent: keep
    referer: origin
    claims: hash

# Only these peers may set X-Forwarded-For. Leave empty when xproxy is the
# edge.
trusted_proxies: []

rate_limits:
  - name: per-ip
    key: client_ip
    rate: 50          # requests per second
    burst: 100
  - name: login
    key: client_ip
    rate: 0.2         # one attempt per five seconds
    burst: 5
    action: tarpit
    tarpit_delay: 10s

upstreams:
  - name: web
    balancer: least_conn
    endpoints:
      - {address: 10.0.1.10:8080, weight: 1}
      - {address: 10.0.1.11:8080, weight: 1}
    health_check:
      path: /healthz
      interval: 5s
      timeout: 2s
      healthy_threshold: 2
      unhealthy_threshold: 3
    outlier_ejection:
      consecutive_failures: 5
      base_ejection_time: 30s
      max_ejection_percent: 50
    affinity:
      cookie_name: XPSESS
      ttl: 1h
      secret_file: /var/lib/xproxy/affinity.key
    timeouts:
      connect: 5s
      response_header: 30s
      total: 5m
    retries: 1

  - name: api
    balancer: hash
    hash_on: header:X-Tenant
    scheme: https
    tls:
      server_name: api.internal
      ca_file: /etc/xproxy/certs/internal-ca.pem
      min_version: "1.3"
      client_cert_file: /etc/xproxy/certs/edge.pem        # mutual TLS to the API
      client_key_file: /etc/xproxy/certs/edge-key.pem
      # spki_pins: ["<xproxyctl spki api.internal.pem>"]
    endpoints:
      - {address: 10.0.2.10:8443}
      - {address: 10.0.2.11:8443}

routes:
  - name: login
    hosts: [example.com, www.example.com]
    paths: [/login]
    methods: [POST]
    rate_limits: [login, per-ip]
    max_body_bytes: 16384
    priority_class: high
    challenge: {mode: always}
    upstream: web

  - name: api
    hosts: [api.example.com]
    paths: [/v1]
    strip_prefix: /v1
    rate_limits: [per-ip]
    upstream: api
    jwt: {provider: idp}
    waf: {profile: api-strict, mode: block}
    request_headers:
      remove: [Cookie]
    response_headers:
      set:
        Strict-Transport-Security: "max-age=63072000; includeSubDomains"
        X-Content-Type-Options: nosniff

  - name: admin
    hosts: [example.com]
    paths: [/admin]
    allow_cidrs: [10.0.0.0/8, 192.168.0.0/16]
    priority_class: critical
    upstream: web

  - name: upload
    hosts: [example.com, www.example.com]
    paths: [/upload]
    methods: [POST, PUT]
    rate_limits: [per-ip]
    icap: {service: av}                   # scan uploads before the application sees them
    upstream: web

  - name: web
    hosts: [example.com, www.example.com]
    rate_limits: [per-ip]
    websocket: true
    challenge: {mode: load, level: 0.5}   # only while the site is under pressure
    upstream: web
    response_headers:
      set:
        Strict-Transport-Security: "max-age=63072000; includeSubDomains"
        X-Content-Type-Options: nosniff
        X-Frame-Options: DENY
        Referrer-Policy: strict-origin-when-cross-origin

  - name: default
    priority: -100
    waf: {mode: detect}
    respond: {status: 404, body: "not found\n"}

# Ban list: repeated denies turn into temporary bans with escalation.
bans:
  state_file: /var/lib/xproxy/bans.db
  action: drop                      # close connections from banned peers at accept
  exempt_cidrs: [10.0.0.0/8]        # monitoring and office ranges
  triggers:
    - name: waf-repeat
      reasons: [waf]
      threshold: 5
      window: 1m
      duration: 15m
      escalation: 2
      max_duration: 24h
    - name: brute-force
      reasons: [rate_limit, acl]
      threshold: 20
      window: 5m
      duration: 1h

# Web application firewall: OWASP Core Rule Set, blocking by default.
# Start new deployments with default_mode: detect, review security.log,
# add exclusions to directive_files, then switch to block.
waf:
  default_mode: block
  default_profile: default
  request_body_limit: 1048576       # 1 MiB inspected
  request_body_limit_action: reject
  inspect_responses: true
  response_body_limit: 524288
  profiles:
    - name: default
      crs:
        paranoia_level: 1
        inbound_threshold: 5
        outbound_threshold: 4
      # directive_files: [/etc/xproxy/waf/exclusions.conf]
    - name: api-strict
      crs:
        paranoia_level: 2
      directives: |
        # Allow JSON bodies only on the API profile.
        SecRule REQUEST_HEADERS:Content-Type "!@rx ^application/json" \
          "id:100100,phase:1,deny,status:415,msg:'API accepts JSON only'"

# Cluster: share rate limit consumption and bans with the other proxies.
# Remove this section on a single node. Listen on the internal interface
# and firewall the port to the peers.
cluster:
  node_id: edge-1
  listen: 10.0.0.1:7946
  peers: [10.0.0.2:7946, 10.0.0.3:7946]
  gossip_interval: 1s
  tls:
    cert_file: /etc/xproxy/cluster/edge-1.pem
    key_file: /etc/xproxy/cluster/edge-1-key.pem
    ca_file: /etc/xproxy/cluster/ca.pem
    allowed_names: [edge-1, edge-2, edge-3]

# Adaptive load shedding: shed low priority routes first when the upstream
# slows past the target or the proxy nears its concurrency ceiling.
shedding:
  target_latency: 250ms
  window: 10s
  low: 0.6
  normal: 0.8
  high: 0.95

# Browser challenge used by routes with a challenge block.
challenge:
  secret_file: /var/lib/xproxy/challenge.key
  difficulty: 16
  ttl: 1h
  exempt_cidrs: [10.0.0.0/8]

# Token validation for the API.
jwt:
  providers:
    - name: idp
      issuer: https://idp.example.com/
      audiences: [api]
      algorithms: [RS256, ES256]
      jwks_url: https://idp.example.com/.well-known/jwks.json
      jwks_ca_file: /etc/xproxy/certs/idp-ca.pem
      jwks_refresh: 1h
      forward_claims: {X-User: sub, X-Scopes: scope}
      log_claims: [sub]

# ACME account for the tls.acme groups above. http-01 answers on every
# plaintext listener before the redirect; tls-alpn-01 answers on the TLS
# listener itself.
acme:
  directory: https://acme-v02.api.letsencrypt.org/directory
  email: hostmaster@example.com
  accept_terms: true
  challenge: http-01
  state_dir: /var/lib/xproxy/acme
  renew_before: 720h                 # 30 days
  check_interval: 12h

# External scanning over ICAP (anti-virus, data loss prevention).
icap:
  services:
    - name: av
      url: icaps://scanner.internal:11344/avscan
      tls: {ca_file: /etc/xproxy/certs/internal-ca.pem}
      timeout: 5s
      max_body: 52428800
      body_limit_action: reject
      fail: closed
      preview: auto
