# Prometheus alerting rules for Xproxy, shipped with the product. Load
# with rule_files in prometheus.yml (or import into Grafana managed
# alerts). Every rule carries a severity label (page or warn) and a
# runbook hint in the description; thresholds are conservative starting
# points and are meant to be tuned per site.
groups:
  - name: xproxy.availability
    rules:
      - alert: XproxyDown
        expr: up{job=~".*xproxy.*"} == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "Xproxy on {{ $labels.instance }} is not being scraped"
          description: "The metrics endpoint has been down for 2 minutes. Check the service (systemctl status xproxy) and the metrics listener allow list."
      - alert: XproxyNoHealthyEndpoint
        expr: xproxy_upstream_endpoints_healthy == 0 and xproxy_upstream_endpoints > 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: "Upstream {{ $labels.upstream }} on {{ $labels.instance }} has no healthy endpoint"
          description: "Every endpoint of the pool is failing health checks or ejected; requests get 503. xproxyctl upstreams shows the endpoints and their last error."
      - alert: XproxyEndpointUnhealthy
        expr: xproxy_upstream_endpoint_healthy == 0
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Endpoint {{ $labels.endpoint }} of {{ $labels.upstream }} unhealthy on {{ $labels.instance }}"
          description: "The endpoint has failed health checks for 5 minutes while the pool still serves from the others."
      - alert: XproxyCircuitOpen
        expr: xproxy_upstream_circuit_state == 2
        for: 2m
        labels: {severity: warn}
        annotations:
          summary: "Circuit breaker open for {{ $labels.upstream }} on {{ $labels.instance }}"
          description: "The pool's error ratio tripped the breaker; requests are refused until the half open probe succeeds."
      - alert: XproxyHigh5xxRatio
        expr: |
          sum by (instance) (rate(xproxy_responses_total{class="5xx"}[5m]))
            / clamp_min(sum by (instance) (rate(xproxy_requests_total[5m])), 1) > 0.05
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "More than 5% of responses are 5xx on {{ $labels.instance }}"
          description: "Server errors over 5 minutes. Split by route with xproxy_route_requests_total{outcome=\"5xx\"} and check upstream errors and timeouts."
      - alert: XproxyHighLatency
        expr: histogram_quantile(0.99, sum by (instance, le) (rate(xproxy_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "p99 request latency above 2s on {{ $labels.instance }}"
          description: "Compare with xproxy_upstream_ttfb_seconds to tell upstream slowness from proxy load; check xproxy_load_level."
      - alert: XproxyShedding
        expr: max by (instance, class) (xproxy_shedding) == 1
        for: 2m
        labels: {severity: warn}
        annotations:
          summary: "Xproxy on {{ $labels.instance }} is shedding {{ $labels.class }} traffic"
          description: "Adaptive load shedding has been refusing the class for 2 minutes; the node is saturated or an upstream is slow."
      - alert: XproxyQueueRefusals
        expr: sum by (instance) (rate(xproxy_upstream_queue_refused_total[5m])) > 1
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Pool queues refusing requests on {{ $labels.instance }}"
          description: "Requests wait for a pool slot longer than the queue allows; raise the pool concurrency or add endpoints."

  - name: xproxy.operations
    rules:
      - alert: XproxyReloadFailed
        expr: increase(xproxy_reloads_total{result="failed"}[15m]) > 0
        labels: {severity: warn}
        annotations:
          summary: "A configuration reload failed on {{ $labels.instance }}"
          description: "The previous configuration stays active. xproxyctl reload -dry-run prints the validation error."
      - alert: XproxyCertificateExpiring
        expr: min by (instance, listener) (xproxy_certificate_expiry_seconds) < 14 * 24 * 3600
        for: 1h
        labels: {severity: warn}
        annotations:
          summary: "Certificate on listener {{ $labels.listener }} ({{ $labels.instance }}) expires within 14 days"
          description: "Renew and reload (xproxyctl reload-certs), or check ACME renewal with xproxyctl acme."
      - alert: XproxyCertificateExpiringSoon
        expr: min by (instance, listener) (xproxy_certificate_expiry_seconds) < 3 * 24 * 3600
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "Certificate on listener {{ $labels.listener }} ({{ $labels.instance }}) expires within 3 days"
          description: "Clients will start failing TLS handshakes; renew now."
      - alert: XproxyLogDrops
        expr: sum by (instance, sink) (increase(xproxy_log_dropped_total[15m])) > 0
        labels: {severity: warn}
        annotations:
          summary: "Log records dropped by the {{ $labels.sink }} sink on {{ $labels.instance }}"
          description: "The collector is slow or unreachable; the proxy never waits, so events are being lost. xproxyctl telemetry shows the last error."
      - alert: XproxyLogWriteErrors
        expr: increase(xproxy_log_write_errors_total[15m]) > 0
        labels: {severity: page}
        annotations:
          summary: "Log file writes failing on {{ $labels.instance }}"
          description: "The log directory is full or unwritable; access and security evidence is being lost."
      - alert: XproxyClusterPeerDown
        expr: xproxy_cluster_peers_connected < xproxy_cluster_peers
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "Cluster peer unreachable from {{ $labels.instance }}"
          description: "Shared rate limits and bans degrade to local decisions towards the missing peer. xproxyctl cluster lists the peers."
      - alert: XproxyICAPUnreachable
        expr: xproxy_icap_reachable == 0
        for: 5m
        labels: {severity: warn}
        annotations:
          summary: "ICAP service {{ $labels.service }} unreachable from {{ $labels.instance }}"
          description: "Requests follow the service's on_error setting (pass or block) until it answers again."

  - name: xproxy.security
    rules:
      - alert: XproxyAttackSurge
        expr: |
          sum by (instance) (rate(xproxy_denied_total{reason=~"waf|acl|rate_limit|ban|filter"}[5m]))
            > 10 * clamp_min(sum by (instance) (rate(xproxy_denied_total{reason=~"waf|acl|rate_limit|ban|filter"}[1h] offset 1h)), 0.1)
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "Denied requests on {{ $labels.instance }} are ten times the hourly baseline"
          description: "An attack or a broken client. rate(xproxy_denied_total) by reason and the security log show who and what; bans and challenges apply automatically where configured."
      - alert: XproxyWAFBlockSpike
        expr: sum by (instance) (rate(xproxy_denied_total{reason="waf"}[5m])) > 5
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "WAF blocking more than 5 requests per second on {{ $labels.instance }}"
          description: "Either an attack or a false positive after a deployment; xproxyctl waf rules names the rules and xproxyctl waf proposals the candidate exclusions."
      - alert: XproxyBanWave
        expr: sum by (instance) (increase(xproxy_bans_total[15m])) > 100
        labels: {severity: warn}
        annotations:
          summary: "More than 100 bans in 15 minutes on {{ $labels.instance }}"
          description: "A distributed attack or a misfiring trigger; xproxyctl bans lists the reasons."
      - alert: XproxyProtocolRefusalSurge
        expr: |
          sum by (instance, kind) (rate(xproxy_refusals_total[5m]))
            > 10 * clamp_min(sum by (instance, kind) (rate(xproxy_refusals_total[1h] offset 1h)), 0.1)
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "{{ $labels.kind }} refusals on {{ $labels.instance }} are ten times the hourly baseline"
          description: "XproxyAttackSurge for the protocols that are not HTTP: a bastion or relay listener refusing far more than usual. sum by (reason) (rate(xproxy_refusals_total{kind=\"{{ $labels.kind }}\"}[5m])) names the policy, and the security log carries the client and the detail behind each one."
      - alert: XproxyUntrackedRefusals
        expr: sum by (instance) (increase(xproxy_refusals_untracked_total[1h])) > 0
        labels: {severity: warn}
        annotations:
          summary: "Refusals on {{ $labels.instance }} carried no reason label"
          description: "A bug rather than an attack: a listener kind named a refusal under an unknown kind or past its reason bound, so it is missing from xproxy_refusals_total. The refusals themselves still happened and the security log still has them. Worth a report."
      - alert: XproxyHoneypotActivity
        expr: sum by (instance) (increase(xproxy_honeypot_hits_total[1h])) > 20
        labels: {severity: warn}
        annotations:
          summary: "Honeypot routes hit more than 20 times in an hour on {{ $labels.instance }}"
          description: "Scanning activity; the clients are marked and their requests logged with honeypot_marked."
      - alert: XproxyRateLimitSaturated
        expr: |
          sum by (instance, policy) (rate(xproxy_rate_limit_decisions_total{outcome="denied"}[5m]))
            / clamp_min(sum by (instance, policy) (rate(xproxy_rate_limit_decisions_total[5m])), 1) > 0.5
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "Rate limit policy {{ $labels.policy }} denies more than half of its decisions on {{ $labels.instance }}"
          description: "The limit is too tight for legitimate traffic or an abuser is being held off; xproxyctl quotas shows the top keys."
      - alert: XproxyAccessRequestWaiting
        expr: max by (instance) (xproxy_access_grants{state="pending"}) > 0
        for: 30m
        labels: {severity: warn}
        annotations:
          summary: "An access request has been waiting half an hour on {{ $labels.instance }}"
          description: "Somebody asked for just-in-time access and nobody has approved or refused it. An approval queue that is not answered is an operator who cannot work, and an approval system that is quietly ignored is worse than none: xproxyctl access -state pending lists them."
      - alert: XproxySessionsRefusedForWantOfAGrant
        expr: sum by (instance) (rate(xproxy_access_refusals_total{reason=~"no_grant|grant_expired|grant_pending"}[15m])) > 0
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "Sessions on {{ $labels.instance }} are being refused for want of an access grant"
          description: "A gate listener with require_grant is turning people away: either the estate has not adopted the asking-and-approving habit yet, or somebody is trying to use a bastion they have no window for. The reason label separates the two: no_grant is nobody asked, grant_pending is nobody approved, grant_expired is a window that closed."
      - alert: XproxyAccessSelfApprovalOn
        expr: |
          sum by (instance) (increase(xproxy_access_uses_total[24h])) > 0
            and sum by (instance) (increase(xproxy_access_approvals_total[24h])) == 0
        for: 1h
        labels: {severity: warn}
        annotations:
          summary: "Access grants on {{ $labels.instance }} are being used with no approvals recorded"
          description: "Sessions opened against grants in the last day and not one approval was recorded in the same day, which means approvals: 0 or self_approval: true -- just-in-time and time-boxed, but not four eyes. Intended on a single-operator estate; on any other it is the setting an attacker who reaches one account most wants."
      - alert: XproxyAuthorizationGapsWidening
        expr: sum by (instance) (rate(xproxy_authz_default_total[30m])) > 0
        for: 30m
        labels: {severity: warn}
        annotations:
          summary: "Sessions on {{ $labels.instance }} are being decided by the authorization default, not by a rule"
          description: "The authorisation policy is deciding by its default because no rule matched, which means the rules describe less of the estate than whoever wrote them believes. With the default deny -- which it should be -- these are people being turned away one at a time; with it allow, they are people getting through that nobody wrote a rule for. Read xproxyctl status: it prints every rule with its hit count."
      - alert: XproxyAuthorizationShadowed
        expr: max by (instance) (xproxy_authz_shadow) == 1
        for: 24h
        labels: {severity: warn}
        annotations:
          summary: "The authorization policy on {{ $labels.instance }} has enforced nothing for a day"
          description: "authorization.shadow is set, so the policy is evaluated and what it would have refused is written down, but every session goes through. That is the right way to read a new policy against real traffic for a week; left on, it is a policy an estate believes in and does not have."
      - alert: XproxyAuthorizationDefaultAllows
        expr: max by (instance) (xproxy_authz_default_allows) == 1
        for: 1h
        labels: {severity: warn}
        annotations:
          summary: "The authorization policy on {{ $labels.instance }} allows what no rule matched"
          description: "authorization.default is allow, so every identity, target and hour nobody wrote a rule about is permitted. A policy whose gaps are invisible is a policy that will be found to have one by somebody else first."
  - name: xproxy.custody
    rules:
      - alert: XproxySecretStale
        expr: max by (instance) (xproxy_secrets_stale) > 0
        for: 30m
        labels: {severity: warn}
        annotations:
          summary: "A secret on {{ $labels.instance }} has not refreshed for half an hour"
          description: "A reference's source stopped answering and the previous value is still in force, which is the deliberate behaviour -- a vault that is down must not take a TLS key away from a proxy that is serving with it. But it means rotation has stopped without anything stopping: a revoked key keeps being served until this is fixed. xproxyctl status names the references and the error log carries a line per failure."
      - alert: XproxyFIPSRefusesConfiguredAlgorithms
        expr: max by (instance) (xproxy_fips_refused_algorithms) > 0
        labels: {severity: warn}
        annotations:
          summary: "The FIPS module on {{ $labels.instance }} refuses a configured algorithm"
          description: "A key exchange group or cipher suite a listener offers is one the active module will not do, so clients that ask for it cannot handshake. Measured at start by handshaking over an in-process pipe; xproxyctl status lists which. Either narrow the configuration to what the module does or accept that those clients fall back."
  - name: xproxy.feeds
    rules:
      - alert: XproxyThreatFeedFailing
        expr: sum by (instance, list) (increase(xproxy_threat_feed_fetches_total{result="failed"}[30m])) > 2
        for: 30m
        labels: {severity: warn}
        annotations:
          summary: "The threat feed {{ $labels.list }} on {{ $labels.instance }} has failed to fetch repeatedly"
          description: "A fetch that fails keeps the entries already read, which is deliberate -- a publisher having an outage must not empty the policy. But the list has stopped being current while it goes on matching, so an indicator the publisher withdrew is still blocking and a new one is not. xproxyctl status names the source and the error log carries a line per failure."
      - alert: XproxyThreatListStale
        expr: max by (instance, list) (xproxy_threat_list_age_seconds) > 86400
        for: 1h
        labels: {severity: warn}
        annotations:
          summary: "The threat list {{ $labels.list }} on {{ $labels.instance }} has not been read for a day"
          description: "Either refresh is 0 and nothing re-reads it, or every attempt since has failed. An imported list nobody refreshes is a policy frozen at the moment it was loaded."
      - alert: XproxyThreatListEmpty
        expr: min by (instance, list) (xproxy_threat_list_entries) == 0
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "The threat list {{ $labels.list }} on {{ $labels.instance }} holds no entries"
          description: "A list with no entries matches nothing while the configuration says it is enforced, which is the failure this project refuses to have silently: a structured feed whose shape changed, or a kind that does not match what the feed carries. xproxy_threat_list_skipped says whether the objects were there and went unread."
  - name: xproxy.mfa
    rules:
      - alert: XproxyPushFatigue
        expr: sum by (instance) (increase(xproxy_mfa_push_total{result="throttled"}[10m])) > 3
        labels: {severity: page}
        annotations:
          summary: "Approval requests on {{ $labels.instance }} are being refused by the fatigue bounds"
          description: "Somebody is asking for more approvals than the policy allows, which is what an attacker with a working first factor does: send notifications until the person taps approve to stop the buzzing. The bounds refused them and no notification was sent, but a first factor is being used that should not be. Look at the security log for the user and the client address, and consider revoking that credential."
      - alert: XproxyApprovalServiceFailing
        expr: sum by (instance) (increase(xproxy_mfa_push_total{result="failed"}[15m])) > 2
        for: 15m
        labels: {severity: page}
        annotations:
          summary: "The approval service for {{ $labels.instance }} is not answering usefully"
          description: "The push second factor fails closed, so an approval service that cannot be reached means nobody with that factor can sign in. Counted apart from a denial on purpose: this is an outage rather than somebody saying no."
  - name: xproxy.accounts
    rules:
      - alert: XproxyCredentialStuffing
        expr: sum by (instance) (rate(xproxy_account_actions_total{class="login",action=~"captcha|block"}[10m])) > 0.5
        for: 10m
        labels: {severity: warn}
        annotations:
          summary: "Login endpoints on {{ $labels.instance }} are escalating to CAPTCHA or block more than 30 times a minute"
          description: "Credential stuffing or brute force against the login form; xproxyctl accounts shows the endpoints, tracked keys and active blocks, and the security log carries the hashed accounts and addresses."
      - alert: XproxyAccountCampaign
        expr: sum by (instance) (increase(xproxy_account_campaigns_total[15m])) > 0
        labels: {severity: warn}
        annotations:
          summary: "A distributed account attack campaign was declared on {{ $labels.instance }}"
          description: "Failures spread over many addresses crossed the distributed thresholds; every unverified client of the endpoint is challenged while it lasts. Consider a net or ja4 aggregated ban trigger if it repeats."
      - alert: XproxyRegistrationAbuse
        expr: sum by (instance) (rate(xproxy_account_actions_total{class="register",action=~"challenge|captcha|block"}[15m])) > 0.2
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "Registration abuse on {{ $labels.instance }}"
          description: "Repeated or bulk registrations, or disposable e-mail domains, are being challenged or blocked; xproxy_account_disposable_total separates the throwaway addresses."
      - alert: XproxySensitiveDataLeak
        expr: sum by (instance) (increase(xproxy_sensitive_messages_total{direction="response",outcome=~"masked|blocked"}[15m])) > 0
        labels: {severity: page}
        annotations:
          summary: "Responses carrying sensitive data were masked or blocked on {{ $labels.instance }}"
          description: "The application returned card numbers, identity numbers, tokens or keys; the access log lists the routes with sensitive_types and sensitive_where. Fix the application; the filter is a safety net."
      - alert: XproxySensitiveDataLogged
        expr: sum by (instance) (rate(xproxy_sensitive_findings_total[1h])) > 1
        for: 1h
        labels: {severity: warn}
        annotations:
          summary: "Sensitive data findings above one per second on {{ $labels.instance }}"
          description: "Either a leak in log mode or a detector that needs tuning; xproxy_sensitive_findings_total by kind shows which detector fires."
      - alert: XproxyCaptchaFailures
        expr: |
          sum by (instance) (rate(xproxy_challenges_total{result="failed"}[15m]))
            > 5 * clamp_min(sum by (instance) (rate(xproxy_challenges_total{result="passed"}[15m])), 0.01)
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "Challenge verifications on {{ $labels.instance }} fail five times more often than they pass"
          description: "Automation hammering the challenge or a broken CAPTCHA provider configuration (site key, secret, verify_url); the security log names the failure class."
      - alert: XproxyDNSAnswerDenied
        expr: sum by (instance) (rate(xproxy_dns_answer_denied_total[15m])) > 0
        for: 15m
        labels: {severity: warn}
        annotations:
          summary: "DNS answers on {{ $labels.instance }} are pointing into denied ranges"
          description: "answer_policy refused an upstream answer: a name resolving to loopback, private space or a cloud metadata endpoint. That is DNS rebinding or a server-side request forgery attempt, or an internal zone that needs answer_policy.allow_names. The dns_answer_denied security event names the address."
      - alert: XproxyDNSServingStale
        expr: sum by (instance) (rate(xproxy_dns_stale_total[10m])) > 0
        for: 10m
        labels: {severity: page}
        annotations:
          summary: "DNS answers on {{ $labels.instance }} are being served past their TTL"
          description: "serve_stale is answering from expired entries because the upstream resolvers are not answering (RFC 8767). The resolver is up and the answers are getting older; check xproxy_dns_upstream_failures_total and the upstreams themselves."
