# Optional drop-in: let systemd refuse every bind except the listed ports.
# Socket activated listeners are bound by systemd and unaffected; list
# the ports xproxy binds itself (metrics.listen, cluster.listen, dns
# listeners, listeners without a matching .socket unit).
#
# Install:  mkdir -p /etc/systemd/system/xproxy.service.d
#           cp 10-socket-bind.conf /etc/systemd/system/xproxy.service.d/
#           systemctl daemon-reload && systemctl restart xproxy.service
[Service]
SocketBindDeny=any
SocketBindAllow=tcp:9100
SocketBindAllow=tcp:7946
SocketBindAllow=udp:53
SocketBindAllow=tcp:53
