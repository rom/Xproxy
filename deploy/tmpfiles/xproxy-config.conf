# The configuration directory the three daemons read (systemd-tmpfiles).
#
# They run as three users and share this directory: each reads its own
# file in it, and they share the includes beside it. No one of them can
# own it, and none of them may declare it with ConfigurationDirectory=,
# because systemd chowns that to the unit's own user on every start --
# three units doing so in turn is three daemons taking the directory
# from each other, and at 0750 the two that did not start last cannot
# read their configuration at all.
#
# So it belongs to root and to the group they share, and only that group
# may enter it. The group grants this directory and nothing else.
d /etc/xproxy 0750 root xproxy-config -
