# The directory the local cluster sockets live in (systemd-tmpfiles).
#
# The three daemons run as three users, so no one of them can own the
# directory: it belongs to root and to the group they share, and only
# that group may enter it. The sockets inside are 0660, so the
# permissions of the directory and of the socket both have to be wrong
# before an unrelated process can reach one.
#
# Install this only where a local cluster is configured. An empty
# directory nobody uses is harmless, but a group that exists for a
# reason nobody remembers is not.
d /run/xproxy-cluster 0770 root xproxy-cluster -
