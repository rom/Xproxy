# The directory the signing helper's socket lives in (systemd-tmpfiles).
#
# The socket's permissions are the whole authentication: a digest says nothing
# about what it is a digest of, so anything that can connect to the socket can
# have anything signed by the keys the helper holds. So the directory is the
# outer gate and the socket is the inner one, and both have to be wrong before
# an unrelated process can reach it.
#
# xsigner owns the directory because it creates the socket in it. The group is
# xsigner-clients, whose members -- the three proxy daemons -- may enter it but
# not write in it, so no proxy can replace the socket with one of its own. The
# setgid bit is the working part: a socket created here inherits the directory's
# group, so the helper's own primary group does not have to be the clients'
# group for the proxies to be able to connect.
#
# Connecting to a Unix socket needs *write* permission on it, which is why the
# socket itself is 0660 and not 0600; it is the pair of permissions that makes
# this safe, not either one alone.
#
# Install this only where a signer is configured.
d /run/xsigner 2750 xsigner xsigner-clients -
