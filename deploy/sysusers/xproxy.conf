# System users for xproxy (systemd-sysusers). The GUI runs as its own user
# and is a member of the xproxy group for the management socket.
#
# The three daemons share two groups, each for exactly one thing.
# xproxy-cluster admits them to each other's cluster sockets under
# /run/xproxy-cluster. xproxy-config admits them to /etc/xproxy, the
# configuration directory they read in common: each daemon reads its own
# file there, and they share the includes beside it. Neither group
# grants anything else, and neither is the xproxy group, which is what
# reaches xproxy's management socket.
u xproxy - "xproxy reverse proxy" /var/lib/xproxy /usr/sbin/nologin
u xgate - "xgate SSH bastion" /var/lib/xgate /usr/sbin/nologin
u xrelay - "xrelay machine relay" /var/lib/xrelay /usr/sbin/nologin
u xproxy-admin - "xproxy web GUI" /var/lib/xproxy /usr/sbin/nologin
m xproxy-admin xproxy
g xproxy-cluster - - -
m xproxy xproxy-cluster
m xgate xproxy-cluster
m xrelay xproxy-cluster
g xproxy-config - - -
m xproxy xproxy-config
m xgate xproxy-config
m xrelay xproxy-config
m xproxy-admin xproxy-config
u xproxy-fleet - "xproxy fleet controller" /var/lib/xproxy-fleet /usr/sbin/nologin
