# System users for xproxy (systemd-sysusers). The GUI runs as its own user
# and is a member of the xproxy group for the management socket.
#
# The three daemons share the xproxy-cluster group, which is what admits
# them to each other's cluster sockets under /run/xproxy-cluster. It
# grants nothing else: a member of it can reach the cluster sockets and
# no other file this product installs.
u xproxy - "xproxy reverse proxy" /var/lib/xproxy /usr/sbin/nologin
u xgate - "xgate SSH bastion" /var/lib/xgate /usr/sbin/nologin
u xrelay - "xrelay machine relay" /var/lib/xrelay /usr/sbin/nologin
u xproxy-admin - "xproxy web GUI" /var/lib/xproxy /usr/sbin/nologin
m xproxy-admin xproxy
g xproxy-cluster - - -
m xproxy xproxy-cluster
m xgate xproxy-cluster
m xrelay xproxy-cluster
u xproxy-fleet - "xproxy fleet controller" /var/lib/xproxy-fleet /usr/sbin/nologin
