version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - prealloc
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are reviewed case by case; errcheck covers them
    misspell:
      ignore-rules:
        # Eclipse Mosquitto is a product name, spelled with two t's.
        - mosquitto
        # `SEL/**/ECT` and `SEL--x\nECT` are a keyword cut in half on purpose:
        # the sqlkind classifier's whole claim is that a comment is whitespace
        # rather than nothing, so those two halves must not rejoin. `ECT` is the
        # second half, not a typo for `ETC`.
        - ect
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, noctx, bodyclose, unparam]
      - path: internal/icap/icaptest/
        linters: [gosec, errcheck, noctx, bodyclose, unparam, staticcheck]
      - path: internal/acme/acmetest/
        linters: [gosec, errcheck, noctx, bodyclose, unparam, staticcheck]
formatters:
  enable:
    - gofmt
